<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trouble Brewing — Storyteller Grimoire</title>
<style>
  :root {
    --bg:#f5f6f8; --panel:#ffffff; --text:#1b1f24; --muted:#59616c; --border:#d3d8df; --accent:#2457c5; --accent-text:#ffffff;
    --good:#1d5fd1; --good-bg:#e7efff; --out:#0b6e60; --out-bg:#dff4ef;
    --minion:#ad1f27; --minion-bg:#fde7e7; --demon:#7a0f22; --demon-bg:#f7d3da;
    --warn-bg:#fff4d6; --warn-text:#5c4300; --ok-bg:#e3f6e8; --ok-text:#14532d; --bad-bg:#fde2e2; --bad-text:#7f1d1d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg:#0f1318; --panel:#171c23; --text:#e6e9ee; --muted:#9ea7b3; --border:#2d3540; --accent:#7aa2ff; --accent-text:#0f1318;
      --good:#8db0ff; --good-bg:#1a2742; --out:#5fd8bd; --out-bg:#11302a;
      --minion:#ff8a8a; --minion-bg:#3b1a1c; --demon:#ffa3b1; --demon-bg:#45141e;
      --warn-bg:#3a3015; --warn-text:#ffe08a; --ok-bg:#12321f; --ok-text:#a7f3c0; --bad-bg:#3e1616; --bad-text:#fecaca;
    }
  }
  * { box-sizing:border-box; }
  body { margin:0; font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text); }
  header { position:sticky; top:0; z-index:5; background:var(--panel); color:var(--text); border-bottom:1px solid var(--border); padding:10px 16px; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; }
  header h1 { font-size:18px; margin:0; }
  .phase { font-weight:700; padding:4px 10px; border-radius:999px; background:var(--good-bg); color:var(--good); }
  .phase.night { background:var(--demon-bg); color:var(--demon); }
  .stats { color:var(--muted); }
  nav { display:flex; gap:4px; padding:8px 16px 0; flex-wrap:wrap; }
  nav button { border-bottom-left-radius:0; border-bottom-right-radius:0; }
  nav button[aria-selected="true"] { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  main { padding:16px; max-width:1200px; margin:0 auto; }
  button, select, input, textarea { font:inherit; color:var(--text); background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:6px 10px; }
  button { cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible { outline:3px solid var(--accent); outline-offset:2px; }
  button.primary { background:var(--accent); color:var(--accent-text); border-color:var(--accent); font-weight:600; }
  button.danger { color:var(--bad-text); background:var(--bad-bg); border-color:var(--bad-text); }
  textarea { width:100%; min-height:90px; }
  label { display:block; margin:8px 0 4px; }
  .inline { display:inline-flex; align-items:center; gap:6px; margin:4px 12px 4px 0; }
  .panel { background:var(--panel); color:var(--text); border:1px solid var(--border); border-radius:12px; padding:14px 16px; margin-bottom:14px; }
  .panel h2, .panel h3 { margin-top:0; }
  .muted { color:var(--muted); }
  .row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:8px 0; }
  .msg { padding:8px 12px; border-radius:8px; margin:6px 0; }
  .msg.warn { background:var(--warn-bg); color:var(--warn-text); }
  .msg.ok { background:var(--ok-bg); color:var(--ok-text); }
  .msg.bad { background:var(--bad-bg); color:var(--bad-text); }
  table { border-collapse:collapse; width:100%; }
  th, td { border:1px solid var(--border); padding:4px 8px; text-align:center; }
  tr.current td { background:var(--good-bg); color:var(--good); font-weight:700; }

  .grim { display:grid; grid-template-columns:minmax(0,1fr) 340px; gap:16px; align-items:start; }
  @media (max-width:900px){ .grim { grid-template-columns:1fr; } }
  .circle { position:relative; width:100%; max-width:720px; aspect-ratio:1; margin:0 auto; }
  .center { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); text-align:center; width:40%; color:var(--muted); }
  .center strong { display:block; font-size:20px; color:var(--text); }
  .seat { position:absolute; transform:translate(-50%,-50%); width:118px; min-height:92px; padding:6px; border-radius:12px; border:2px solid var(--border); display:flex; flex-direction:column; align-items:center; text-align:center; gap:1px; background:var(--panel); color:var(--text); }
  .seat.selected { outline:3px solid var(--accent); outline-offset:2px; }
  .seat.townsfolk { background:var(--good-bg); color:var(--good); border-color:var(--good); }
  .seat.outsider { background:var(--out-bg); color:var(--out); border-color:var(--out); }
  .seat.minion { background:var(--minion-bg); color:var(--minion); border-color:var(--minion); }
  .seat.demon { background:var(--demon-bg); color:var(--demon); border-color:var(--demon); }
  .seat.dead { opacity:.6; border-style:dashed; }
  .circle .seat { touch-action:manipulation; user-select:none; -webkit-user-select:none; -webkit-touch-callout:none; cursor:grab; transition:left .18s ease, top .18s ease; }
  .circle .seat.armed { outline:3px solid var(--accent); outline-offset:2px; transform:translate(-50%,-50%) scale(1.06); }
  .circle .seat.dragging { z-index:10; cursor:grabbing; transition:none; box-shadow:0 8px 24px rgba(0,0,0,.3); }
  .circle.free { border:2px dashed var(--border); border-radius:24px; }
  .circle.free .seat { transition:none; }
  .ring { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  .ring polygon { fill:none; stroke:var(--muted); stroke-width:.35; stroke-dasharray:1.2 1.2; opacity:.7; }
  .seat-num { position:absolute; top:3px; inset-inline-start:6px; font-size:10px; font-weight:700; color:var(--muted); }
  .layout-bar { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin-bottom:8px; }
  .layout-bar button[aria-pressed="true"] { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }

  /* Script picker */
  .scripts { display:grid; grid-template-columns:repeat(auto-fit, minmax(240px, 1fr)); gap:12px; }
  .script-card { text-align:start; display:flex; flex-direction:column; gap:6px; padding:12px 14px; border-radius:12px; border:2px solid var(--border); background:var(--panel); color:var(--text); }
  .script-card.current, .script-card[aria-pressed="true"] { border-color:var(--accent); outline:2px solid var(--accent); outline-offset:1px; }
  .script-card h3 { margin:0; font-size:17px; }
  .script-card p { margin:0; font-size:13px; }
  .level { display:inline-block; align-self:flex-start; font-size:12px; font-weight:700; padding:2px 10px; border-radius:999px; }
  .level-1 { background:var(--ok-bg); color:var(--ok-text); }
  .level-2 { background:var(--warn-bg); color:var(--warn-text); }
  .level-3 { background:var(--bad-bg); color:var(--bad-text); }
  .level-4 { background:var(--demon-bg); color:var(--demon); }
  .script-table { margin-top:8px; }
  .script-table th, .script-table td { text-align:start; vertical-align:middle; }
  .script-table tr.current td { background:var(--good-bg); color:var(--good); }
  .script-table td.num { text-align:end; }
  /* Cairo (SIL Open Font License, fonts/OFL.txt), bundled locally so Arabic looks right offline. */
  @font-face { font-family:"Cairo"; font-style:normal; font-weight:400 800; font-display:swap; src:url("fonts/cairo-arabic.woff2") format("woff2"); unicode-range:U+0600-06FF, U+0750-077F, U+0870-0891, U+0897-08E1, U+08E3-08FF, U+200C-200E, U+2010-2011, U+204F, U+2E41, U+FB50-FDFF, U+FE70-FE74, U+FE76-FEFC, U+102E0-102FB, U+10E60-10E7E, U+10EC2-10EC7, U+10EC9-10EEE, U+10EF0-10EFF, U+1EE00-1EE03, U+1EE05-1EE1F, U+1EE21-1EE22, U+1EE24, U+1EE27, U+1EE29-1EE32, U+1EE34-1EE37, U+1EE39, U+1EE3B, U+1EE42, U+1EE47, U+1EE49, U+1EE4B, U+1EE4D-1EE4F, U+1EE51-1EE52, U+1EE54, U+1EE57, U+1EE59, U+1EE5B, U+1EE5D, U+1EE5F, U+1EE61-1EE62, U+1EE64, U+1EE67-1EE6A, U+1EE6C-1EE72, U+1EE74-1EE77, U+1EE79-1EE7C, U+1EE7E, U+1EE80-1EE89, U+1EE8B-1EE9B, U+1EEA1-1EEA3, U+1EEA5-1EEA9, U+1EEAB-1EEBB, U+1EEF0-1EEF1; }
  @font-face { font-family:"Cairo"; font-style:normal; font-weight:400 800; font-display:swap; src:url("fonts/cairo-latin.woff2") format("woff2"); unicode-range:U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD; }
  [dir="rtl"] body, [dir="rtl"] button, [dir="rtl"] select, [dir="rtl"] input, [dir="rtl"] textarea, #langBtn[lang="ar"] {
    font-family:"Cairo",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif; }
  [dir="rtl"] body { line-height:1.65; }
  .orig-name { font-size:12px; font-family:system-ui,-apple-system,"Segoe UI",sans-serif; }
  .script-card .orig-name { margin-top:-4px; }
  [dir="rtl"] .seat-name { font-size:14px; } [dir="rtl"] .seat-char { font-size:12.5px; line-height:1.35; }
  /* Seats, notes and code keep left-to-right where it matters */
  [dir="rtl"] #json, [dir="rtl"] #importJson { direction:ltr; text-align:left; }
  details.more { margin-top:12px; }
  details.more > summary { cursor:pointer; font-weight:600; padding:6px 0; }
  .meter { display:flex; justify-content:space-between; gap:8px; font-size:13px; }
  .dots { letter-spacing:2px; }
  .dots .on { color:var(--accent); } .dots .off { color:var(--border); }
  .seat-icon { font-size:20px; }
  .seat-name { font-weight:700; color:var(--text); font-size:13px; }
  .seat-char { font-size:12px; }
  .seat-status { font-size:11px; color:var(--text); }
  .tags { display:flex; flex-wrap:wrap; gap:2px; justify-content:center; }
  .tag { font-size:10px; padding:0 5px; border-radius:6px; background:var(--warn-bg); color:var(--warn-text); }
  .hidden-grim .seat-char, .hidden-grim .seat-icon, .hidden-grim .tags { visibility:hidden; }
  .hidden-grim .seat.townsfolk, .hidden-grim .seat.outsider, .hidden-grim .seat.minion, .hidden-grim .seat.demon { background:var(--panel); color:var(--text); border-color:var(--border); }

  ol.steps { padding-inline-start:0; list-style:none; }
  .step { border:1px solid var(--border); border-radius:10px; padding:10px 12px; margin:8px 0; background:var(--panel); color:var(--text); }
  .step.done { opacity:.55; }
  .step.skip { opacity:.5; }
  .step.skip strong { text-decoration:line-through; }
  .step p { margin-block:4px 0; margin-inline:26px 0; }
  .step .flag { color:var(--bad-text); background:var(--bad-bg); padding:2px 8px; border-radius:6px; display:inline-block; }
  .step .hint { color:var(--ok-text); background:var(--ok-bg); padding:2px 8px; border-radius:6px; display:inline-block; }
  .who { color:var(--muted); font-weight:400; }

  .sheet h3 { margin:14px 0 6px; padding-bottom:4px; border-bottom:2px solid var(--border); }
  .sheet .team-townsfolk { color:var(--good); } .sheet .team-outsider { color:var(--out); }
  .sheet .team-minion { color:var(--minion); } .sheet .team-demon { color:var(--demon); }
  .char-line { display:grid; grid-template-columns:32px 220px 1fr; gap:6px; padding:4px 0; border-bottom:1px solid var(--border); }
  @media (max-width:700px){ .char-line { grid-template-columns:32px 1fr; } .char-line .ab { grid-column:2; } }
  .orig { color:var(--muted); font-size:12px; }

  /* Deal */
  .deal-who { font-size:22px; margin:8px 0; }
  .cards { display:grid; grid-template-columns:repeat(auto-fill, minmax(72px, 1fr)); gap:10px; margin:10px 0; }
  .card { aspect-ratio:3/4; font-size:28px; font-weight:800; background:var(--good-bg); color:var(--good); border:2px solid var(--good); border-radius:12px; }
  .overlay { position:fixed; inset:0; z-index:50; background:var(--panel); color:var(--text); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; padding:24px; text-align:center; }
  .overlay h2 { font-size:30px; margin:0; }
  .big-icon { font-size:84px; line-height:1; }
  .team-word { font-size:22px; font-weight:800; margin:0; }
  .team-word.good { color:var(--good); } .team-word.evil { color:var(--minion); }
  .ability-big { font-size:18px; max-width:520px; }
  button.big { font-size:20px; padding:14px 24px; border-radius:12px; }
  /* Player-facing info cards */
  .overlay { overflow-y:auto; }
  .show-section { display:flex; flex-direction:column; align-items:center; gap:8px; }
  .show-label { font-size:20px; margin:0; color:var(--muted); }
  .chip-row { display:flex; flex-wrap:wrap; gap:10px; justify-content:center; }
  .name-chip { font-size:26px; font-weight:800; padding:8px 18px; border-radius:999px; background:var(--good-bg); color:var(--good); border:2px solid var(--good); }
  .token-chip { font-size:20px; font-weight:700; padding:8px 14px; border-radius:12px; background:var(--good-bg); color:var(--good); border:2px solid var(--good); }
  .big-number { font-size:120px; font-weight:900; line-height:1; color:var(--text); }
  .big-yesno { font-size:72px; font-weight:900; line-height:1.1; }
  .big-yesno.yes { color:var(--ok-text); } .big-yesno.no { color:var(--bad-text); }
  /* Card builder (Storyteller-facing) */
  .overlay.composer { justify-content:flex-start; align-items:center; text-align:start; }
  .composer-box { width:100%; max-width:680px; display:flex; flex-direction:column; gap:6px; }
  .composer-box h2 { font-size:24px; }
  .composer-box fieldset { border:1px solid var(--border); border-radius:10px; margin:4px 0; padding:6px 10px 10px; }
  .composer-box fieldset.suggested { border:2px solid var(--accent); background:var(--good-bg); color:var(--text); }
  .composer-box fieldset.suggested legend::after { content:" ★"; color:var(--accent); }
  .composer-box .chip-row { justify-content:flex-start; gap:6px; }
  button.mini { padding:6px 10px; border-radius:999px; }
  button.mini.num { min-width:44px; font-weight:700; }
  button.mini[aria-pressed="true"] { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .chip-row.quick button.mini { font-size:13px; }
  .big-text { font-size:26px; font-weight:700; max-width:600px; margin:0; }
  /* Timer */
  .timer { display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .timer-text { font-size:56px; font-weight:900; font-variant-numeric:tabular-nums; line-height:1; color:var(--text); }
  .timer.done .timer-text { color:var(--bad-text); }
  .timer-up { font-size:22px; font-weight:800; color:var(--bad-text); background:var(--bad-bg); padding:4px 12px; border-radius:999px; }
  button.mini.sug { border-color:var(--accent); font-weight:700; }
  .timer-hdr { font-weight:800; font-variant-numeric:tabular-nums; background:var(--warn-bg); color:var(--warn-text); border-color:var(--warn-text); }
  /* Log + reveal */
  ul.log-list { padding-inline-start:20px; }
  ul.log-list li { margin:3px 0; }
  .overlay.reveal { justify-content:flex-start; }
  table.reveal-table { width:100%; margin:8px 0; }
  table.reveal-table td { text-align:start; font-size:17px; padding:6px 8px; }
  table.reveal-table tr.evil td { background:var(--minion-bg); color:var(--minion); }
  table.reveal-table tr.good td { background:var(--good-bg); color:var(--good); }
  .juggle-row select { flex:1; min-width:120px; }
  ul.past-list { list-style:none; padding:0; margin:0; }
  ul.past-list li { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; padding:10px 0; border-bottom:1px solid var(--border); }
  .badge { display:inline-block; font-size:12px; font-weight:700; padding:2px 10px; border-radius:999px; margin-inline-start:6px; }
  .badge.good { background:var(--good-bg); color:var(--good); } .badge.evil { background:var(--minion-bg); color:var(--minion); }
  .badge.open { background:var(--warn-bg); color:var(--warn-text); }
  /* Nominations & voting */
  .vote-box { border:2px solid var(--accent); border-radius:12px; padding:10px 12px; margin:8px 0; background:var(--panel); color:var(--text); }
  .vote-title { font-size:20px; margin:4px 0; }
  .vote-count { font-size:22px; margin:4px 0; }
  .vote-count b { font-size:30px; }
  ol.vote-rows { list-style:none; padding:0; margin:8px 0; }
  ol.vote-rows li { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:6px 8px; border-radius:10px; border:1px solid var(--border); margin:4px 0; }
  ol.vote-rows li.current { border:2px solid var(--accent); background:var(--good-bg); color:var(--text); }
  ol.vote-rows li.cannot { opacity:.5; }
  .voter { font-size:17px; font-weight:600; }
  .vote-btns { display:flex; gap:6px; flex-shrink:0; }
  button.vote { font-size:22px; min-width:56px; min-height:48px; border-radius:12px; }
  button.vote.yes[aria-pressed="true"] { background:var(--ok-bg); color:var(--ok-text); border-color:var(--ok-text); }
  button.vote.no[aria-pressed="true"] { background:var(--bad-bg); color:var(--bad-text); border-color:var(--bad-text); }
  ol.nom-list { padding-inline-start:20px; }
  ol.nom-list li { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:2px 0; }
  ol.nom-list li.on-block { font-weight:700; color:var(--warn-text); }
  .block-banner { font-size:16px; }
  /* "Ask them to choose" (player-facing) */
  .prompt-box { align-items:center; text-align:center; }
  .prompt-box h2 { margin:0; font-size:28px; }
  .prompt-what { font-size:26px; font-weight:800; margin:8px 0 0; }
  .pick-grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(130px, 1fr)); gap:10px; width:100%; margin:8px 0; }
  .pick-btn { font-size:20px; font-weight:700; padding:14px 10px; border-radius:14px; border:2px solid var(--border); background:var(--panel); color:var(--text); }
  .pick-btn.char { font-size:16px; }
  .pick-btn[aria-pressed="true"] { background:var(--accent); color:var(--accent-text); border-color:var(--accent); }
  .pick-btn:disabled { opacity:.35; cursor:not-allowed; }
  .pick-result { margin-block:6px 0; margin-inline:26px 0; padding:8px 12px; border-inline-start:4px solid var(--good); background:var(--bg); color:var(--text); border-radius:6px; }
  .pick-result p { margin:4px 0; }
  @media (max-width:600px) { .pick-result { margin-inline:0; } .pick-grid { grid-template-columns:repeat(2, 1fr); } }
  /* Advisor */
  .advice { margin-block:8px 0; margin-inline:26px 0; padding:8px 12px; border-inline-start:4px solid var(--accent); background:var(--bg); color:var(--text); border-radius:6px; }
  .advice p { margin:6px 0; }
  fieldset.balance { border:1px solid var(--border); border-radius:10px; margin:10px 0; }
  @media (max-width:600px) {
    header h1 { font-size:16px; }
    .seat { width:72px; min-height:64px; font-size:11px; }
    .seat-icon { font-size:16px; }
    .seat-name { font-size:11px; } .seat-char { font-size:10px; }
    [dir=rtl] .seat-name { font-size:12px; } [dir=rtl] .seat-char { font-size:11px; }
    .circle { margin-top:40px; }
    .step p, .advice { margin-inline-start:0; }
    header { position:static; }
  }
  .table-scroll { overflow-x:auto; }
  .touch-only { display:none; }
  @media (pointer:coarse) { .touch-only { display:inline; } }
  @media (pointer:coarse) { button { min-height:44px; } input[type=checkbox] { width:20px; height:20px; } }
  @media print {
    header, nav, .no-print { display:none !important; }
    body { background:#fff; color:#000; }
    .panel { border:none; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>
</head>
<body>
<header>
  <h1 id="title">😈 Trouble Brewing</h1>
  <span id="scriptLevel" class="level"></span>
  <span id="phase" class="phase" aria-live="polite"></span>
  <span id="stats" class="stats" aria-live="polite"></span>
  <button id="timerHdr" class="timer-hdr" data-action="tab" data-tab="night" hidden title="Discussion timer"></button>
  <div class="row" style="margin:0">
    <button data-action="prev-phase" aria-label="Previous phase">◀ Back</button>
    <button data-action="next-phase" class="primary">Next phase ▶</button>
    <button data-action="compose" data-blank="1" title="Show any message, player, character or number on the phone">📱 Show something</button>
    <button data-action="toggle-hide" id="hideBtn"></button>
    <button data-action="toggle-lang" id="langBtn" class="no-tr"></button>
  </div>
</header>
<nav role="tablist" aria-label="Sections" id="tabs"></nav>
<main id="view"></main>

  const spare = team => shuffle(pool(team).filter(x => !x.setup && !REQUIRES[x.id] && ![...tf, ...out].includes(x)));
  while (out.length < target) { // more Outsiders: swap out a plain Townsfolk
    const add = spare("outsider")[0], rm = shuffle(tf.filter(x => !x.setup && !REQUIRES[x.id]))[0];
    if (!add || !rm) break;
    tf = tf.filter(x => x !== rm); out.push(add);
  }
  while (out.length > target) { // fewer Outsiders: swap out a plain Outsider
    const add = spare("townsfolk")[0], rm = shuffle(out.filter(x => !x.setup))[0];
    if (!add || !rm) break;
    out = out.filter(x => x !== rm); tf.push(add);
  }
  // Huntsman needs the Damsel, Choirboy needs the King. The required character takes a
  // Townsfolk's place ("+the Damsel" therefore adds an Outsider).
  for (const [a, b] of Object.entries(REQUIRES)) {
    const need = BY_ID[b];
    if (!need || ![...tf, ...out].some(c => c.id === a) || [...tf, ...out].includes(need)) continue;
    const plain = x => x.id !== a && x.id !== b && !REQUIRES[x.id] && !x.setup;
    const r2 = shuffle(tf).find(plain) || shuffle(out).find(plain);
    if (!r2) continue;
    tf = tf.filter(x => x !== r2); out = out.filter(x => x !== r2);
    (need.team === "outsider" ? out : tf).push(need);
  }
  // Small scripts can run out of a character type: fill any gap with unused good characters.
  const picked = new Set([...tf, ...out, ...minions, demon]);
  const leftover = shuffle([...pool("townsfolk"), ...pool("outsider")].filter(c => !picked.has(c) && !c.setup && !REQUIRES[c.id]));
  while (picked.size < n && leftover.length) { const c = leftover.pop(); picked.add(c); (c.team === "outsider" ? out : tf).push(c); }
  const chosen = shuffle([...tf, ...out, ...minions, demon]).map(c => c.id);
  // The Marionette must sit next to the Demon.
  const mi = chosen.indexOf("marionette");
  if (mi >= 0) { const j = (chosen.indexOf(demon.id) + 1) % chosen.length; [chosen[mi], chosen[j]] = [chosen[j], chosen[mi]]; }
  const used = new Set(chosen);
  // Players who think they're someone else: the Lunatic is shown the real Demon; others get an unused character.
  const drunkAs = {};
  chosen.map(id => BY_ID[id]).filter(c => c.thinks).forEach(c => {
    const fake = c.thinks === "demon" ? demon : pick(ofTeam(c.thinks).filter(x => !used.has(x.id) && !x.special));
    if (fake) { drunkAs[c.id] = fake.id; used.add(fake.id); }
  });
  const bluffs = shuffle(ofTeam("townsfolk").filter(c => !used.has(c.id))).slice(0, 3).map(c => c.id);
  return {chars:chosen, drunkAs, bluffs};
}

// Once every seat has a character: place the Fortune Teller's red herring.
const isRedHerring = q => q.reminders.some(r => r.toLowerCase() === "red herring");
function finishSetup(){
  state.players.forEach(p => p.reminders = p.reminders.filter(r => r.toLowerCase() !== "red herring"));
  ensureRedHerring();
}
// Hand-built games skip finishSetup, so also place one when Night 1 starts.
function ensureRedHerring(){
  const good = state.players.filter(p => p.char && !isEvil(p));
  if (good.length && state.players.some(p => effective(p)?.id === "fortuneteller") && !state.players.some(isRedHerring))
    pick(good).reminders.push("Red herring");
}

function resetGameFlags(){ archiveCurrent(); state.gameId = null; state.gameStart = null; // keep the old game in Past games
  state.done = {}; state.phase = 0; state.advice = {}; state.choices = {}; state.picks = {}; state.days = {};
  state.log = []; state.snap = null; state.ended = null; state.juggle = {}; }

function randomAssign(){
  const n = state.players.length;
  if (!DIST[n]) { alert("Create 5 to 15 seats first."); return; }
  if (state.players.some(p => p.char) && !confirm("Re-roll every character?")) return;
  const r = rollSetup(n);
  state.players.forEach((p, i) => Object.assign(p, {char:r.chars[i], drunkAs:r.drunkAs[r.chars[i]] || null, alive:true, ghostVote:true, reminders:[]}));
  state.bluffs = r.bluffs;
  state.deal = null;
  finishSetup();
  resetGameFlags();
}

// ---------------------------------------------------------------------------
// Deal: pass the phone around, each player taps a numbered card
// ---------------------------------------------------------------------------
let reveal = null; // {mode:"deal", cardIdx, seatId, stage} | {mode:"remind", seatId, stage}

function startDeal(mode){
  const n = state.players.length;
  if (!DIST[n]) { alert("Create 5 to 15 seats in Setup first."); return; }
  let cards;
  if (mode === "assigned") {
    if (state.players.some(p => !p.char)) { alert("Give every seat a character in the Grimoire first, or use random characters."); return; }
    const thinker = state.players.find(p => charOf(p)?.thinks && !p.drunkAs);
    if (thinker) { alert(`Pick which character the ${charOf(thinker).name} thinks they are first.`); return; }
    cards = state.players.map(p => ({char:p.char, drunkAs:p.drunkAs}));
  } else {
    if (state.players.some(p => p.char) && !confirm("Start a new random deck? Current characters will be cleared.")) return;
    const r = rollSetup(n);
    cards = r.chars.map(c => ({char:c, drunkAs:r.drunkAs[c] || null}));
    state.bluffs = r.bluffs;
  }
  state.deal = {cards:shuffle(cards).map((c, i) => ({...c, num:i + 1, seat:null})), seat:state.players[0].id};
  state.players.forEach(p => Object.assign(p, {char:null, drunkAs:null, alive:true, ghostVote:true, reminders:[]}));
  resetGameFlags();
  reveal = null;
}

function seatsWithoutCard(){ return state.players.filter(p => !state.deal.cards.some(c => c.seat === p.id)); }

function finishReveal(){
  if (reveal.mode === "deal") {
    const card = state.deal.cards[reveal.cardIdx], p = playerById(reveal.seatId);
    card.seat = p.id; p.char = card.char; p.drunkAs = card.drunkAs;
    // Next player clockwise who hasn't drawn yet
    const left = seatsWithoutCard();
    if (left.length) {
      const i = state.players.indexOf(p);
      state.deal.seat = (state.players.slice(i + 1).concat(state.players.slice(0, i)).find(q => left.includes(q)) || left[0]).id;
    } else finishSetup();
  }
  reveal = null;
}

let showing = null; // card currently shown to a woken player

function overlayHtml(){
  if (showing) return showCardHtml(showing);
  if (revealOpen && state.ended) return revealHtml();
  if (pastOpen) { const g = loadHistory().find(x => x.id === pastOpen); if (g) return pastHtml(g); pastOpen = null; }
  if (composer) return composerHtml(composer);
  if (prompt) return promptHtml(prompt);
  if (!reveal) return "";
  const p = playerById(reveal.seatId); if (!p) { reveal = null; return ""; }
  if (reveal.stage === "confirm") {
    return `<div class="overlay" role="dialog" aria-modal="true" aria-label="Private reveal">
      <p class="deal-who">Only <b>${esc(p.name)}</b> should look now.</p>
      <button class="primary big" data-action="reveal-show">👀 Tap to see your character</button>
      <button data-action="reveal-cancel">Cancel</button></div>`;
  }
  const src = reveal.mode === "deal" ? state.deal.cards[reveal.cardIdx] : p;
  const shown = (BY_ID[src.char].thinks && BY_ID[src.drunkAs]) || BY_ID[src.char]; // Drunk / Lunatic see their fake character
  const evil = ["minion","demon"].includes(shown.team);
  return `<div class="overlay" role="dialog" aria-modal="true" aria-label="Your character">
    <div class="big-icon" aria-hidden="true">${shown.icon}</div>
    <h2>You are the ${esc(shown.name)}</h2>
    <p class="team-word ${evil ? "evil" : "good"}">${evil ? "😈 You are EVIL" : "😇 You are GOOD"} · ${esc(TEAM_LABEL[shown.team].replace(/ \(.*\)$/, ""))}</p>
    <p class="ability-big">${esc(shown.ability)}</p>
    <button class="primary big" data-action="reveal-done">✅ Got it, hide it</button></div>`;
}

function viewDeal(){
  const n = state.players.length;
  if (!n) return `<section class="panel"><p>Create seats in <button data-action="tab" data-tab="setup">Setup</button> first (names in seating order).</p></section>`;
  const intro = `<section class="panel"><h2>Deal characters</h2>
    <p class="muted">Walk round the table clockwise with your phone. Each player taps a number and sees their character in private, then taps "Got it". The app puts their character on their seat in the Grimoire.</p>
    <div class="row"><button class="primary" data-action="deal-new" data-mode="random">🎲 New deck: random characters</button>
    <button data-action="deal-new" data-mode="assigned">New deck: the characters I chose</button></div></section>`;
  const d = state.deal;
  if (!d) return intro;
  const left = seatsWithoutCard();
  if (left.length && !left.some(p => p.id === d.seat)) d.seat = left[0].id;
  const cur = playerById(d.seat);
  const body = !left.length
    ? `<div class="msg ok">✓ Everyone has a character. The Grimoire is filled in.</div>
       <div class="row"><button class="primary" data-action="start-game">Start Night 1</button></div>`
    : `<p class="deal-who">Hand the phone to <b>${esc(cur.name)}</b></p>
       <label for="dealSeat">Someone else is picking? Choose them:</label>
       <select id="dealSeat" data-change="deal-seat">${left.map(p => `<option value="${p.id}" ${p.id === d.seat ? "selected" : ""}>${esc(p.name)}</option>`).join("")}</select>
       <p>${esc(cur.name)}, pick a number:</p>
       <div class="cards">${d.cards.map((c, i) => c.seat ? "" : `<button class="card" data-action="deal-pick" data-i="${i}" aria-label="Card ${c.num}">${c.num}</button>`).join("")}</div>
       <p class="muted">${n - left.length} of ${n} dealt.</p>`;
  const dealt = state.players.filter(p => p.char);
  const remind = dealt.length ? `<section class="panel"><h3>Player forgot their character?</h3>
    <div class="row"><label for="remindSel" class="inline">Show again to</label>
    <select id="remindSel">${dealt.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
    <button data-action="remind">Show privately</button></div></section>` : "";
  return intro + `<section class="panel">${body}</section>` + remind;
}

// ---------------------------------------------------------------------------
// Info advisor: what to tell each information character
// state.balance: "good" = good is ahead, "evil" = evil is ahead, "even"
// Suggestions lean toward helping whichever side is behind.
// ---------------------------------------------------------------------------
const ADVICE_IDS = new Set(["washerwoman","librarian","investigator","chef","empath","fortuneteller","undertaker","ravenkeeper"]);
const nm = q => `<b>${esc(q.name)}</b>`;
const tok = id => `<b>${BY_ID[id].icon} ${esc(BY_ID[id].name)}</b>`;
function pickPref(list, prefer){ const p = list.filter(prefer); return p.length ? pick(p) : (list.length ? pick(list) : null); }
const decoyPref = q => state.balance === "good" ? isEvil(q) : state.balance === "evil" ? !isEvil(q) : true;
const notInPlay = team => ofTeam(team).filter(c => !inPlay(c.id) && !state.players.some(p => p.drunkAs === c.id));
function pairWith(target, pool, prefer){ const decoy = pickPref(pool.filter(q => q !== target), prefer); return shuffle([target, decoy].filter(Boolean)); }
const pointTo = pair => pair.map(nm).join(" and ");

// Each suggestion = {html: what the Storyteller reads, card: what the woken player sees on the phone}.
// card = {sections:[{label, token?, tokens?[], names?[] (player ids), number?, yesno?}]}
const A = (html, ...sections) => ({html, card:sections.length ? {sections} : null});
const ids = list => list.map(q => q.id);
const PAIR_LABEL = "One of these players is the";

function makeAdvice(s, ch){
  const ps = state.players, p = playerById(s.pid), idx = ps.indexOf(p), others = ps.filter(q => q !== p);
  const good = others.filter(q => !isEvil(q)), t = s.truthful, bal = state.balance;
  const has = id => others.find(q => q.char === id);
  const bluff = state.bluffs.find(Boolean);
  switch (s.effId) {
    case "washerwoman": {
      const tf = others.filter(q => charOf(q)?.team === "townsfolk");
      if (t) {
        if (!tf.length) {
          const fake = pick(notInPlay("townsfolk")) || pick(ofTeam("townsfolk")), pair = shuffle(others).slice(0, 2);
          return A(`No other Townsfolk in play. Show ${tok(fake.id)} and point to ${pointTo(pair)}.`, {label:PAIR_LABEL, token:fake.id, names:ids(pair)});
        }
        const T = pick(tf), pair = pairWith(T, others, decoyPref);
        let txt = `Show ${tok(T.char)}. Point to ${pointTo(pair)}. (${esc(T.name)} really is the ${esc(BY_ID[T.char].name)}.)`;
        const spy = has("spy");
        if (bal === "good" && spy && bluff) txt += `<br><i>To help evil instead:</i> the Spy can register as a Townsfolk, so you could show ${tok(bluff)} and point to ${nm(spy)} and someone else.`;
        return A(txt, {label:PAIR_LABEL, token:T.char, names:ids(pair)});
      }
      const imp = has("imp");
      if (bal === "good" && bluff && imp) {
        const pair = pairWith(imp, others, q => !isEvil(q));
        return A(`Show ${tok(bluff)}. Point to ${pointTo(pair)}. This backs up the Demon's bluff, a big help for evil.`, {label:PAIR_LABEL, token:bluff, names:ids(pair)});
      }
      const fake = pick(bal === "evil" ? notInPlay("townsfolk") : tf.length ? tf.map(q => BY_ID[q.char]) : notInPlay("townsfolk")) || pick(ofTeam("townsfolk"));
      const pair = shuffle(good.filter(q => q.char !== fake.id)).slice(0, 2);
      return A(`Show ${tok(fake.id)}. Point to ${pointTo(pair)} (neither of them is it).`, {label:PAIR_LABEL, token:fake.id, names:ids(pair)});
    }
    case "librarian": {
      const outs = others.filter(q => charOf(q)?.team === "outsider");
      const zero = {label:"Number of Outsiders in play", number:0};
      if (t) {
        if (!outs.length) return A("No Outsiders in play: show <b>0</b>.", zero);
        const O = pick(outs), pair = pairWith(O, others, decoyPref);
        return A(`Show ${tok(O.char)}. Point to ${pointTo(pair)}. (${esc(O.name)} really is the ${esc(BY_ID[O.char].name)}.)`, {label:PAIR_LABEL, token:O.char, names:ids(pair)});
      }
      if (outs.length && bal !== "evil") return A(`Show <b>0</b>, even though there ${outs.length === 1 ? "is an Outsider" : "are Outsiders"} in play.`, zero);
      const fake = pick(notInPlay("outsider").length ? notInPlay("outsider") : ofTeam("outsider")), pair = shuffle(good).slice(0, 2);
      return A(`Show ${tok(fake.id)}. Point to ${pointTo(pair)}.`, {label:PAIR_LABEL, token:fake.id, names:ids(pair)});
    }
    case "investigator": {
      const mins = others.filter(q => charOf(q)?.team === "minion");
      if (t && !mins.length) return A("No Minions in play (e.g. Legion or Atheist game). Give them false information of your choice: any Minion token and 2 players.");
      if (t) {
        const M = pick(mins), pair = pairWith(M, others, decoyPref);
        let txt = `Show ${tok(M.char)}. Point to ${pointTo(pair)}. (${esc(M.name)} really is the ${esc(BY_ID[M.char].name)}.)`;
        const rec = has("recluse");
        if (bal === "good" && rec) txt += `<br><i>To help evil instead:</i> the Recluse can register as a Minion, so you could point to ${nm(rec)} and a good player.`;
        return A(txt, {label:PAIR_LABEL, token:M.char, names:ids(pair)});
      }
      const fake = pick(ofTeam("minion")), pair = shuffle(good).slice(0, 2);
      return A(`Show ${tok(fake.id)}. Point to ${pointTo(pair)}. Both are actually good, so this frames innocent players.`, {label:PAIR_LABEL, token:fake.id, names:ids(pair)});
    }
    case "chef": {
      const x = evilPairs(), label = "Pairs of evil players sitting next to each other";
      if (t) return A(`Show <b>${x}</b>.${has("recluse") || has("spy") ? " The Recluse and Spy can change how players register here, but for beginners just give the true number." : ""}`, {label, number:x});
      const f = x > 0 ? x - 1 : 1;
      return A(`Show <b>${f}</b> (the true answer is ${x}).`, {label, number:f});
    }
    case "empath": {
      const nb = aliveNeighbours(idx), x = nb.filter(isEvil).length, label = "How many of your 2 living neighbours are evil";
      if (t) {
        let txt = `Show <b>${x}</b> (neighbours: ${nb.map(nm).join(" and ")}).`;
        if (bal === "good" && nb.some(q => q.char === "spy")) txt += ` <i>To help evil:</i> the Spy can register as good, so you could show ${x - 1}.`;
        if (bal === "good" && nb.some(q => q.char === "recluse")) txt += ` <i>To help evil:</i> the Recluse can register as evil, so you could show ${x + 1}.`;
        return A(txt, {label, number:x});
      }
      const f = x > 0 ? 0 : 1;
      return A(`Show <b>${f}</b> (the true answer is ${x}).`, {label, number:f});
    }
    case "fortuneteller": {
      const [a, b] = (ch || []).map(playerById);
      if (!a || !b) return A("Pick their 2 choices above to get an answer.");
      const card = yes => ({label:`Is ${a.name} or ${b.name} the Demon?`, yesno:yes ? "YES" : "NO"});
      // Any Demon counts (not just the Imp), so community scripts with other Demons work too.
      const hit = [a, b].find(q => isDemon(q) || isRedHerring(q));
      const rec = [a, b].find(q => q.char === "recluse");
      if (!t) return A(`Answer <b>${hit ? "NO" : "YES"}</b> (the truth is ${hit ? "yes" : "no"}).`, card(!hit));
      if (hit) return A(`Answer <b>YES</b>: ${nm(hit)} is ${isDemon(hit) ? "the Demon" : "the red herring"}.`, card(true));
      if (rec && bal === "good") return A(`The truth is NO, but the ${esc(BY_ID.recluse.name)} (${nm(rec)}) can register as the Demon. To help evil, you could answer YES. The card shows NO.`, card(false));
      return A("Answer <b>NO</b>.", card(false));
    }
    case "undertaker": {
      const ex = ps.find(q => hasRem(q, "Executed today")), label = "The player executed today was the";
      if (!ex) return A("Nobody was executed today, so don't wake them.");
      if (!t) {
        const fake = bluff && bluff !== ex.char ? bluff : pick(CHARS.filter(c => c.id !== ex.char && c.team !== "demon")).id;
        return A(`Show ${tok(fake)} (${esc(ex.name)} was really the ${esc(BY_ID[ex.char].name)}).`, {label, token:fake});
      }
      let txt = `Show ${tok(ex.char)}.`;
      if (ex.char === "recluse" && bal === "good") txt += " <i>To help evil:</i> the Recluse can register as a Minion or Demon, so you could show a Minion token.";
      if (ex.char === "spy" && bal === "good") txt += " <i>To help evil:</i> the Spy can register as a Townsfolk or Outsider.";
      return A(txt, {label, token:ex.char});
    }
    case "ravenkeeper": {
      const tg = playerById((ch || [])[0]);
      if (!tg) return A("Pick who they chose above.");
      const label = `${tg.name} is the`;
      if (!t) {
        const fake = tg.char === "imp" && bluff ? bluff : pick(CHARS.filter(c => c.id !== tg.char && c.team !== "demon")).id;
        return A(`Show ${tok(fake)} (really the ${esc(BY_ID[tg.char].name)}).`, {label, token:fake});
      }
      let txt = tg.char === "drunk" ? `Show ${tok("drunk")} (they're really the Drunk).` : `Show ${tok(tg.char)}.`;
      if (tg.char === "recluse" && bal === "good") txt += " <i>To help evil:</i> you could show a Minion or the Imp.";
      if (tg.char === "spy" && bal === "good") txt += " <i>To help evil:</i> you could show a Townsfolk token.";
      return A(txt, {label, token:tg.char});
    }
  }
  return A("");
}

// Cards for steps that aren't "information abilities" but still need showing.
function stepCard(stepKey, pid){
  const ps = state.players;
  const minions = ps.filter(q => charOf(q)?.team === "minion"), demon = ps.filter(isDemon);
  const lunatic = ps.filter(q => q.char === "lunatic");
  switch (stepKey) {
    // The Marionette thinks they're good: they don't learn the evil team, and the other Minions don't learn them.
    case "minioninfo": return {sections:[{label:"The Demon is", names:ids(demon)}, {label:"The Minions (evil team) are", names:ids(minions.filter(q => q.char !== "marionette"))}]};
    case "demoninfo": return {sections:[{label:"Your Minions are", names:ids(minions)},
      ...(lunatic.length ? [{label:"The Lunatic (thinks they are the Demon) is", names:ids(lunatic)}] : []),
      {label:"These good characters are NOT in play. Safe to bluff as", tokens:state.bluffs.filter(Boolean)}]};
    case "becomeimp": {
      // Show the player's actual Demon (Scarlet Woman takeover), or the Imp for a star-pass.
      const p = playerById(pid), tok = isDemon(p) ? p.char : "imp";
      return {sections:[{label:"You are now the", token:tok}, {label:"You are evil, and now the Demon."}]};
    }
  }
  return null;
}
const STEP_CARD_LABEL = {minioninfo:"📱 Show to the Minions", demoninfo:"📱 Show to the Demon"};

function stepCardButtons(s){
  if (STEP_CARD_LABEL[s.key]) return `<p class="row"><button class="primary" data-action="show-step" data-step="${s.key}">${STEP_CARD_LABEL[s.key]}</button></p>`;
  if (s.skip || !s.pid) return "";
  const extra = [];
  const sp = playerById(s.pid);
  if (sp && hasRem(sp, "Became Demon") && isDemon(sp)) extra.push(`<button class="primary" data-action="show-step" data-step="becomeimp" data-pid="${sp.id}">📱 Show "You are now the ${esc(BY_ID[sp.char].name)}"</button>`);
  if (s.effId === "imp") extra.push(`<button data-action="show-step" data-step="becomeimp">📱 If the Imp killed themselves: show the new Imp</button>`);
  if (s.effId === "spy" || s.effId === "widow") extra.push(`<button data-action="spy-grimoire">📱 Open the Grimoire for them</button>`);
  // Anything else to show: use "📱 Show something" in the top bar.
  return extra.length ? `<p class="row">${extra.join("")}</p>` : "";
}

function adviceBlock(s){
  if (!s.pid || !ADVICE_IDS.has(s.effId) || s.skip) return "";
  const k = state.phase + ":" + s.pid, ch = state.choices[k] || [];
  const opts = v => `<option value="">— choose —</option>` + state.players.map(q => `<option value="${q.id}" ${q.id === v ? "selected" : ""}>${esc(q.name)}</option>`).join("");
  let sel = "";
  if (s.effId === "fortuneteller") sel = `<div class="row">They chose
    <select data-change="choice" data-key="${esc(k)}" data-i="0" aria-label="Fortune Teller first choice">${opts(ch[0])}</select> and
    <select data-change="choice" data-key="${esc(k)}" data-i="1" aria-label="Fortune Teller second choice">${opts(ch[1])}</select></div>`;
  if (s.effId === "ravenkeeper") sel = `<div class="row">They chose
    <select data-change="choice" data-key="${esc(k)}" data-i="0" aria-label="Ravenkeeper choice">${opts(ch[0])}</select></div>`;
  if (!state.advice[k] || typeof state.advice[k] !== "object") state.advice[k] = makeAdvice(s, ch);
  const adv = state.advice[k];
  return `<div class="advice">${sel}<p>🧭 <b>Suggested answer${s.truthful ? "" : " (they must get false info)"}:</b> ${adv.html}</p>
    <div class="row">${adv.card ? `<button class="primary" data-action="show-card" data-key="${esc(k)}">📱 Show this answer</button>` : ""}
    <button data-action="reroll" data-key="${esc(k)}">🎲 Another suggestion</button></div></div>`;
}

// Full-screen card the woken player reads.
function showCardHtml(card){
  const sec = s => {
    let h = `<p class="show-label">${esc(s.label)}</p>`;
    if (s.token) h += `<div class="big-icon" aria-hidden="true">${BY_ID[s.token].icon}</div><h2>${esc(BY_ID[s.token].name)}</h2>`;
    if (s.tokens) h += `<div class="chip-row">${s.tokens.map(id => `<span class="token-chip"><span aria-hidden="true">${BY_ID[id].icon}</span> ${esc(BY_ID[id].name)}</span>`).join("")}</div>`;
    if (s.names) h += `<div class="chip-row">${s.names.map(id => `<span class="name-chip">${esc(playerById(id)?.name ?? "?")}</span>`).join("") || `<span class="name-chip">nobody</span>`}</div>`;
    if (s.number != null) h += `<div class="big-number">${s.number}</div>`;
    if (s.yesno) h += `<div class="big-yesno ${s.yesno === "YES" ? "yes" : "no"}">${s.yesno === "YES" ? "✅ YES" : "❌ NO"}</div>`;
    if (s.align) h += `<div class="big-yesno ${s.align === "good" ? "yes" : s.align === "evil" ? "no" : ""}">${ALIGN_LABEL[s.align]}</div>`;
    if (s.text) h += `<p class="big-text">${esc(s.text)}</p>`;
    if (!s.label) h = h.replace(/^<p class="show-label"><\/p>/, "");
    return `<div class="show-section">${h}</div>`;
  };
  return `<div class="overlay" role="dialog" aria-modal="true" aria-label="Information for the player">
    <p class="muted">🌙 For your eyes only</p>
    ${card.sections.map(sec).join("")}
    <button class="primary big" data-action="show-done">✅ Done, hide it</button></div>`;
}

// ---------------------------------------------------------------------------
// Card builder: show ANYTHING to a player on the phone, so the Storyteller never
// has to whisper or point. Opened from every night step, the Day screen, each seat,
// and the top bar. Prefilled from the character's night instructions.
// composer = {label, names[], tokens[], number, yesno, align, text, focus[], extra[]}
// ---------------------------------------------------------------------------
let composer = null, refocus = null;
const ALIGN_LABEL = {good:"👍 Good", evil:"👎 Evil", neither:"✊ Neither"};
const QUICK_LABELS = ["Your information", "You are", "You are now the", "This player is", "These players", "The character is",
  "Your number is", "The answer is", "This character selected you", "These characters are not in play",
  "This is the Demon", "These are your Minions", "Choose a player", "Choose 2 players", "Choose a character",
  "Do you want to use your ability tonight?", "You must be mad about being", "Your secret word is"];
const blankComposer = (o = {}) => ({label:"Your information", names:[], tokens:[], number:null, yesno:null, align:null, text:"", focus:[], extra:[], ...o});

// Turn an existing card (suggested answer, Minion info...) into an editable builder.
function cardToComposer(card){
  const [s, ...rest] = card.sections;
  return blankComposer({label:s.label || "", names:[...(s.names || [])], tokens:s.token ? [s.token] : [...(s.tokens || [])],
    number:s.number ?? null, yesno:s.yesno || null, align:s.align || null, text:s.text || "", extra:rest});
}

// Guess what a character's step shows the player, from its (English) night instructions.
function presetForStep(s){
  if (STEP_CARD_LABEL[s.key]) return cardToComposer(stepCard(s.key));
  const adv = s.pid && state.advice[state.phase + ":" + s.pid];
  if (adv?.card) return cardToComposer(adv.card);
  const c = BY_ID[s.effId]; if (!c) return blankComposer();
  const first = nightNum() === 1, en = c._en || c;
  const t = String((first ? en.firstText : en.otherText) || (first ? c.rf : c.ro) || "").replace(/<[^>]+>/g, "")
    .replace(/&amp;/g, "&").replace(/&#39;/g, "'").replace(/&quot;/g, '"');
  const has = re => re.test(t);
  const p = blankComposer({label:""});
  const info = [[/THIS PLAYER IS/i, "This player is"], [/THIS CHARACTER SELECTED YOU/i, "This character selected you"],
    [/THESE CHARACTERS ARE NOT IN PLAY/i, "These characters are not in play"], [/THIS IS THE DEMON/i, "This is the Demon"],
    [/THESE ARE YOUR MINIONS/i, "These are your Minions"], [/YOU ARE/, "You are"]].find(([re]) => has(re));
  if (has(/finger/i)) { p.focus.push("number"); p.label ||= "Your number is"; }
  if (has(/\bnod\b|shake your head|Nod if/i)) { p.focus.push("yesno"); p.label ||= "The answer is"; }
  if (has(/thumb/i)) { p.focus.push("align"); p.label ||= "The answer is"; }
  if (has(/character tokens?|\btokens?\b|show their character|Show .*(Townsfolk|Outsider|Minion) token/i)) { p.focus.push("tokens"); p.label ||= "The character is"; }
  // "Point to ..." (capitalised, an instruction to the Storyteller), not "They point to ..." (the player choosing).
  if (has(/(^|[.:] )Point to|point to the (Demon|Minions|player|Marionette|Exorcist|Magician|King)\b|Point to any player/)) { p.focus.push("names"); p.label ||= "These players"; }
  // "Show the THIS PLAYER IS & Nightwatchman tokens, then point to the Nightwatchman": prefill both.
  const nm = c._en?.name || c.name;
  if (t.includes(`& ${nm} token`) || t.includes(`and ${nm} token`)) p.tokens.push(c.id);
  if (s.pid && t.includes(`point to the ${nm}`)) p.names.push(s.pid);
  if (info) p.label = info[1];
  if (!p.label) p.label = has(/2 players/i) ? "Choose 2 players" : has(/character/i) && has(/point to|choose/i) ? "Choose a character" : has(/point to|choose/i) ? "Choose a player" : "Your information";
  return p;
}

function composerHtml(c){
  const f = k => c.focus.includes(k) ? "suggested" : "";
  const pressed = v => `aria-pressed="${!!v}"`;
  // Titles are stored in English (so they translate on the card); show them in the current language.
  const shown = l => isAr() && /[A-Za-z]/.test(l) ? trFull(l) : l;
  const isLabel = l => c.label === l || c.label === shown(l);
  const nums = Array.from({length:Math.max(10, state.players.length + 1)}, (_, i) => i);
  return `<div class="overlay composer" role="dialog" aria-modal="true" aria-label="Card builder">
    <div class="composer-box">
      <h2>📱 Show to a player</h2>
      <p class="muted">Fill in what they should see, then hand the phone over. Only the parts you fill in are shown. Highlighted parts fit this character.</p>
      <label for="cLabel">Title</label>
      <input id="cLabel" value="${esc(shown(c.label))}" autocomplete="off">
      <div class="chip-row quick" role="group" aria-label="Quick titles">${QUICK_LABELS.map(l =>
        `<button class="mini" data-action="c-label" data-v="${esc(l)}" ${pressed(isLabel(l))}>${esc(l)}</button>`).join("")}</div>
      ${[ // starred (suggested) sections first, so the one you need is right under the title
        ["names", `<fieldset class="${f("names")}"><legend>Players</legend>
          <div class="chip-row">${state.players.map(p => `<button class="mini" data-action="c-name" data-id="${p.id}" ${pressed(c.names.includes(p.id))}>${esc(p.name)}</button>`).join("")}</div></fieldset>`],
        ["tokens", `<fieldset class="${f("tokens")}"><legend>Characters</legend>
          <div class="chip-row">${c.tokens.map((id, i) => `<button class="mini" data-action="c-token-remove" data-i="${i}" aria-pressed="true" aria-label="Remove ${esc(BY_ID[id]?.name)}">${BY_ID[id]?.icon} ${esc(BY_ID[id]?.name)} ✕</button>`).join("")}</div>
          <label for="cToken" class="inline">Add</label>
          <select id="cToken" data-change="c-token">${charOptions(null)}</select></fieldset>`],
        ["number", `<fieldset class="${f("number")}"><legend>Number</legend>
          <div class="chip-row">${nums.map(n => `<button class="mini num" data-action="c-num" data-v="${n}" ${pressed(c.number === n)}>${n}</button>`).join("")}</div></fieldset>`],
        ["yesno", `<fieldset class="${f("yesno")}"><legend>Yes / No</legend>
          <div class="chip-row"><button class="mini" data-action="c-yesno" data-v="YES" ${pressed(c.yesno === "YES")}>✅ YES</button>
          <button class="mini" data-action="c-yesno" data-v="NO" ${pressed(c.yesno === "NO")}>❌ NO</button></div></fieldset>`],
        ["align", `<fieldset class="${f("align")}"><legend>Thumb signal</legend>
          <div class="chip-row">${Object.entries(ALIGN_LABEL).map(([k, l]) => `<button class="mini" data-action="c-align" data-v="${k}" ${pressed(c.align === k)}>${l}</button>`).join("")}</div></fieldset>`],
      ].sort((a, b) => c.focus.includes(b[0]) - c.focus.includes(a[0])).map(x => x[1]).join("")}
      <label for="cText">Message (optional)</label>
      <textarea id="cText" rows="2" placeholder="Type anything you want them to read">${esc(c.text)}</textarea>
      ${c.extra.length ? `<p class="muted">+ ${c.extra.length} more part(s) from the suggested card will also be shown.</p>` : ""}
      <div class="row"><button class="primary big" data-action="c-show">📱 Show to player</button>
        <button data-action="c-clear">Clear</button><button data-action="c-cancel">Cancel</button></div>
    </div></div>`;
}

function composerCard(c){
  const s = {label:c.label.trim()};
  if (c.names.length) s.names = c.names;
  if (c.tokens.length === 1) s.token = c.tokens[0]; else if (c.tokens.length) s.tokens = c.tokens;
  if (c.number != null) s.number = c.number;
  if (c.yesno) s.yesno = c.yesno;
  if (c.align) s.align = c.align;
  if (c.text.trim()) s.text = c.text.trim();
  return {sections:[s, ...c.extra]};
}

// ---------------------------------------------------------------------------
// "Ask them to choose": the woken player reads what to do on the phone and taps
// their choice. Works for every character whose night step says "They point to...",
// "They may...", or "X chooses...". The choice is recorded on the step, the reminder
// in the instructions ("Mark that player Protected") is applied, and kills get a
// one-tap button for the Storyteller (who still decides).
// prompt = {k, stepKey, pid, effId, spec, players:[], chars:[], stage:"pick"|"done"}
// ---------------------------------------------------------------------------
let prompt = null;
const englishStepText = (c, first) => {
  const en = c._en || c;
  return String((first ? en.firstText : en.otherText) || (first ? c.rf : c.ro) || "").replace(/<[^>]+>/g, "")
    .replace(/&amp;/g, "&").replace(/&#39;/g, "'").replace(/&quot;/g, '"');
};
// What does this step ask the player to choose? null = nothing to choose.
function pickSpec(s){
  const c = BY_ID[s.effId]; if (!c || !s.pid) return null;
  const t = englishStepText(c, nightNum() === 1);
  const act = /They point to|They may|They choose|chooses|might choose|either nods/i;
  const sentence = t.split(/(?<=[.!?])\s+/).find(x => act.test(x)); if (!sentence) return null;
  if (/nods their head yes|nod.*or shakes/i.test(sentence)) return {players:0, chars:0, yesno:true, optional:false, text:t}; // Organ Grinder
  const n = /\b3 players\b/.test(sentence) ? 3 : /\b2 (alive |living )?players\b/.test(sentence) ? 2
    : /\b(a|an|any) (alive |living |dead |good )?player\b|\bplayers?\b/.test(sentence) ? 1 : 0;
  // A character to CHOOSE ("point to a character", "chooses a character"), not "show their character token".
  const ch = /(point to|chooses?|and|or) (a |an )?(good |not-in-play |Demon |Minion )?character(?! token)/i.test(sentence) ? 1 : 0;
  if (!n && !ch) return null;
  const first = nightNum() === 1;
  // Demons don't kill on night 1; a Lunatic / Marionette "acting" as their character kills nobody.
  const pretending = !!charOf(playerById(s.pid))?.thinks;
  const mark = (t.match(/[Mm]ark (?:that player|them|both|the target|that player as) ([A-Z][A-Za-z ()']+?)(?=[.:,]| and )/) || [])[1] || null;
  return {
    players:n, chars:ch, text:t,
    notSelf:/not themselves|not yourself|\(not the [A-Z]/.test(t),
    alive:/\b(alive|living) player/.test(sentence), dead:/\bdead player/.test(sentence),
    optional:/\bmay\b|shake their head|might choose|or no-one|or nobody/i.test(sentence),
    goodChar:/good character/i.test(sentence), notInPlay:/not in play|not-in-play/i.test(sentence),
    mark, kills:!pretending && ((c.team === "demon" && !first && !/poison|swap/i.test(sentence)) || /, who dies|: they die|who die\b|they all die|all die/i.test(t)),
  };
}
const pickKey = s => state.phase + ":" + s.pid;

function promptHtml(pr){
  const c = BY_ID[pr.effId], sp = pr.spec;
  if (pr.stage === "done") return `<div class="overlay" role="dialog" aria-modal="true" aria-label="Choice saved">
    <div class="big-icon" aria-hidden="true">😴</div>
    <h2>Got it.</h2><p class="ability-big">Close your eyes and hand the phone back to the Storyteller.</p>
    <button class="primary big" data-action="p-close">✅ Done</button></div>`;
  const what = sp.yesno ? "Nod yes or no" : sp.players && sp.chars ? (sp.players === 1 ? "Choose a player and a character" : `Choose ${sp.players} players and a character`)
    : sp.players ? (sp.players === 1 ? "Choose a player" : `Choose ${sp.players} players`)
    : sp.goodChar ? "Choose a good character" : sp.notInPlay ? "Choose a character that is not in play" : "Choose a character";
  const notes = [sp.notSelf && "(not yourself)", sp.alive && "Only living players", sp.dead && "Only dead players"].filter(Boolean);
  const players = sp.players ? state.players.filter(q => !(sp.notSelf && q.id === pr.pid)).map(q => {
    const off = (sp.alive && !q.alive) || (sp.dead && q.alive);
    return `<button class="pick-btn" data-action="p-player" data-id="${q.id}" aria-pressed="${pr.players.includes(q.id)}" ${off ? "disabled" : ""}>${q.alive ? "" : "💀 "}${esc(q.name)}</button>`;
  }).join("") : "";
  const charPool = sp.goodChar ? CHARS.filter(x => ["townsfolk","outsider"].includes(x.team))
    : sp.notInPlay ? CHARS.filter(x => !inPlay(x.id)) : CHARS;
  const chars = sp.chars ? charPool.map(x => `<button class="pick-btn char" data-action="p-char" data-v="${x.id}" aria-pressed="${pr.chars.includes(x.id)}"><span aria-hidden="true">${x.icon}</span> ${esc(x.name)}</button>`).join("") : "";
  const ready = sp.yesno ? false : pr.players.length === sp.players && pr.chars.length === sp.chars;
  return `<div class="overlay composer" role="dialog" aria-modal="true" aria-label="Your turn">
    <div class="composer-box prompt-box">
      <p class="muted">🌙 Wake up. It's your turn. <button class="mini" data-action="p-cancel" aria-label="Storyteller: cancel">✕</button></p>
      <div class="big-icon" aria-hidden="true">${c.icon}</div>
      <h2>${esc(c.name)}</h2>
      <p class="muted">Your ability: ${esc(c.ability)}</p>
      <p class="prompt-what">${esc(what)}</p>
      ${notes.length ? `<p class="muted">${notes.map(esc).join(" · ")}</p>` : ""}
      ${players ? `<div class="pick-grid">${players}</div>` : ""}
      ${chars ? `<div class="pick-grid">${chars}</div>` : ""}
      <div class="row">
        ${sp.yesno ? `<button class="primary big" data-action="p-yesno" data-v="YES">✅ YES</button><button class="big" data-action="p-yesno" data-v="NO">❌ NO</button>`
          : `<button class="primary big" data-action="p-confirm" ${ready ? "" : "disabled"}>✅ Confirm</button>`}
        ${sp.optional && !sp.yesno ? `<button class="big" data-action="p-none">🙅 No one</button>` : ""}
      </div>
    </div></div>`;
}

// Save the choice, update suggested answers, and apply the instructed reminder.
function savePick(pr, result){
  const k = pr.k, sp = pr.spec;
  const s = nightSteps().find(x => x.key === pr.stepKey);
  const works = s ? s.truthful : true; // drunk / poisoned: the ability does nothing
  state.picks ||= {};
  // Undo an earlier answer's reminder before applying the new one.
  const old = state.picks[k];
  if (old?.marked) old.players.forEach(id => { const q = playerById(id); if (q) toggleRem(q, old.marked, false); });
  const entry = {...result, marked:null};
  if (sp.mark && works && result.players.length) { result.players.forEach(id => toggleRem(playerById(id), sp.mark, true)); entry.marked = sp.mark; }
  entry.blocked = !!(sp.mark && !works && result.players.length);
  state.picks[k] = entry;
  state.choices[k] = [...result.players]; // feeds the Fortune Teller / Ravenkeeper suggested answers
  delete state.advice[k];
  logEvent("pick", {p:pr.pid, eff:pr.effId, players:result.players, chars:result.chars, yesno:result.yesno, none:result.none});
}

// Under each step: the "Ask them" button, and what they chose.
function pickBlock(s){
  if (s.skip) return "";
  const sp = pickSpec(s); if (!sp) return "";
  const r = state.picks?.[pickKey(s)];
  const ask = `<button class="${r ? "" : "primary"}" data-action="p-open" data-step="${esc(s.key)}">${r ? "↺ Ask again" : "📱 Ask them to choose"}</button>`;
  if (!r) return `<p class="row">${ask}</p>`;
  const names = r.players.map(id => esc(playerById(id)?.name ?? "?"));
  const what = r.yesno ? (r.yesno === "YES" ? "✅ YES" : "❌ NO")
    : r.none ? "No one" : [...names, ...r.chars.map(id => `${BY_ID[id]?.icon} ${esc(BY_ID[id]?.name)}`)].join(", ");
  const kill = sp.kills && r.players.filter(id => playerById(id)?.alive).map(id =>
    `<button class="danger" data-action="p-kill" data-id="${id}">💀 ${esc(playerById(id).name)} dies</button>`).join("");
  // Name exactly why a kill might fail, so the Storyteller doesn't have to remember.
  const shields = sp.kills ? r.players.map(playerById).filter(Boolean).flatMap(q => {
    const why = [];
    if (hasRem(q, "Protected")) why.push(`${q.name}: Protected`);
    if (hasRem(q, "Safe")) why.push(`${q.name}: Safe`);
    const ef = effective(q);
    const ok = x => !hasRem(x, "Poisoned") && !x.reminders.some(r => r.startsWith("Drunk"));
    if (["soldier","sailor","fool"].includes(ef?.id) && q.char === ef.id && ok(q) && !(ef.id === "fool" && hasRem(q, "Ability used"))) why.push(`${q.name}: ${ef.name}`);
    // Tea Lady: her 2 alive neighbours can't die while both are good (she isn't protected herself).
    const tl = aliveNeighbours(state.players.indexOf(q)).find(x => x.char === "tealady" && ok(x));
    if (tl) { const tn = aliveNeighbours(state.players.indexOf(tl));
      if (tn.length === 2 && tn.every(x => !isEvil(x))) why.push(`${q.name}: ${BY_ID.tealady.name} (${tl.name})`); }
    if (q.char === "mayor" && ok(q)) why.push(`${q.name}: ${BY_ID.mayor.name} (someone else might die instead)`);
    return why;
  }) : [];
  return `<div class="pick-result"><p>📱 <b>They chose:</b> ${what}</p>
    ${r.marked ? `<p class="hint">✓ Marked ${esc(r.marked)} on ${names.join(", ")}</p>` : ""}
    ${r.blocked ? `<p class="flag">Not marked: their ability doesn't work tonight (drunk or poisoned).</p>` : ""}
    ${shields.length ? `<p class="flag">🛡️ Might not die: ${shields.map(esc).join(" · ")}</p>` : ""}
    ${sp.kills && !r.none ? `<p class="muted">Check protection first (Safe, Protected, Soldier...). You decide who dies.</p>` : ""}
    <div class="row">${kill || ""}${ask}</div></div>`;
}

function randomBluffs(){
  const used = new Set(state.players.flatMap(p => [p.char, p.drunkAs]).filter(Boolean));
  state.bluffs = shuffle(ofTeam("townsfolk").filter(c => !used.has(c.id))).slice(0, 3).map(c => c.id);
  while (state.bluffs.length < 3) state.bluffs.push(null);
}

// ---------------------------------------------------------------------------
// Phase handling (reminders that expire are cleared automatically going forward)
// ---------------------------------------------------------------------------
function setPhase(next){
  if (next < 0) return;
  const forward = next > state.phase;
  state.phase = next;
  if (forward && isNight()) clearRem(SCRIPT.nightClear);
  if (forward && isDay()) {
    clearRem(["Executed today"]);
    // "Became Demon" lasts until the new Demon has been woken on the following night.
    state.players.forEach(p => { if (hasRem(p, "Became Demon") && state.phase - 1 > (p.becameDemonPh ?? -1)) toggleRem(p, "Became Demon", false); });
  }
}

// ---------------------------------------------------------------------------
// Win / status checks
// ---------------------------------------------------------------------------
function statusMessages(){
  const msgs = [];
  if (!state.players.some(p => p.char)) return msgs;
  const alive = state.players.filter(p => p.alive);
  // A Zombuul that "died" once is still in the game.
  const demonAlive = state.players.some(p => charOf(p)?.team === "demon" && (p.alive || hasRem(p, "Fake dead (Zombuul)")));
  const working = p => !hasRem(p, "Poisoned") && !p.reminders.some(r => r.startsWith("Drunk"));
  const mastermind = alive.find(p => p.char === "mastermind" && working(p));
  const twins = state.players.filter(p => p.char === "eviltwin" || hasRem(p, "Twin"));
  // Scarlet Woman: the Demon died with 5+ players alive (4+ still alive now), so she becomes the Demon.
  const sw = alive.find(p => p.char === "scarletwoman" && working(p));
  if (!demonAlive && sw && alive.length >= 4)
    msgs.push(["warn", `The Demon died with 5 or more players alive: the ${esc(BY_ID.scarletwoman.name)} (${esc(sw.name)}) becomes the Demon.
      <div class="row"><button class="primary" data-action="sw-takeover" data-id="${sw.id}">💋 ${esc(sw.name)} becomes the Demon</button></div>`]);
  else if (!demonAlive && mastermind && state.players.some(p => charOf(p)?.team === "demon" && hasRem(p, "Executed today")))
    msgs.push(["warn", `The Demon was executed, but the ${esc(BY_ID.mastermind.name)} (${esc(mastermind.name)}) is alive: play one more day. Whoever is executed tomorrow, their team loses.`]);
  else if (!demonAlive && inPlay("eviltwin") && twins.length >= 2 && twins.every(p => p.alive))
    msgs.push(["warn", `No living Demon, but both twins are alive: good can't win while the ${esc(BY_ID.eviltwin.name)} and their twin live.`]);
  else if (!demonAlive) msgs.push(["ok", "No living Demon: <b>Good wins</b>, unless the Scarlet Woman takes over (5+ players were alive when the Demon died)."]);
  else if (alive.length <= 2) msgs.push(["bad", "Only 2 players alive and the Demon is one of them: <b>Evil wins</b>."]);
  const saint = state.players.find(p => p.char === "saint" && !p.alive && hasRem(p, "Executed today"));
  if (saint) msgs.push(["bad", `The ${esc(BY_ID.saint.name)} (${esc(saint.name)}) was executed: <b>Evil wins</b>, unless they were poisoned.`]);
  if (alive.length === 3 && alive.some(p => p.char === "mayor" && working(p)) && isDay()) msgs.push(["warn", "Mayor alive with 3 players left: if nobody is executed today, <b>Good wins</b>."]);
  return msgs;
}

// ---------------------------------------------------------------------------
// Night order builder
// ---------------------------------------------------------------------------
function nightSteps(){
  const first = nightNum() === 1, ps = state.players, steps = [];
  steps.push({key:"dusk", order:-1, icon:"🌙", title:"Dusk", text:"Everyone closes their eyes. Check that heads are down."});
  if (first) {
    if (ps.length >= 7) {
      steps.push({key:"minioninfo", order:sheetPos("minioninfo", 1), icon:"🧑‍🤝‍🧑", title:"Minion info",
        text:`Wake all Minions (${namesWith(q => charOf(q)?.team === "minion" && q.char !== "marionette")}). Point to the Demon and let the Minions see each other.${ps.some(q => q.char === "marionette") ? " Don't wake the Marionette: they think they're good." : ""}`});
      const bl = state.bluffs.filter(Boolean).map(id => `${BY_ID[id].icon} ${BY_ID[id].name}`).join(", ") || "<i>none picked yet (Setup tab)</i>";
      const lun = ps.find(q => q.char === "lunatic");
      steps.push({key:"demoninfo", order:sheetPos("demoninfo", 2), icon:"😈", title:"Demon info",
        text:`Wake the Demon. Point to their Minions. Show 3 bluffs: ${bl}.${lun ? ` Also point to the Lunatic (${esc(lun.name)}).` : ""}`});
    } else {
      steps.push({key:"smallgame", order:sheetPos("minioninfo", 1), icon:"ℹ️", title:"Small game", text:"With fewer than 7 players, skip Minion info and Demon info."});
    }
  }
  const charList = id => ps.filter(q => charOf(q)?.team === id).map(q => `${esc(BY_ID[q.char].name)} (${esc(q.name)})`).join(", ");
  const lunatic = ps.find(q => q.char === "lunatic");
  ps.forEach((p, idx) => {
    const real = charOf(p), eff = effective(p); if (!eff) return;
    // A Lunatic also has their own first-night wake, separate from the Demon they think they are.
    if (real !== eff) {
      const ro = nightOrder(real, first);
      if (ro != null) steps.push({key:p.id + ":self", order:ro, icon:real.icon, title:real.name, who:p.name,
        text:nightText(real, first), flags:[], hint:[], skip:!p.alive, pid:p.id, effId:real.id, truthful:true});
    }
    const order = nightOrder(eff, first); if (order == null) return;
    const flags = [], hint = [];
    let skip = !p.alive && !eff.wakesDead;
    if (eff.id === "ravenkeeper" && !hasRem(p, "Died tonight")) skip = true;
    if (eff.id === "scarletwoman" && !hasRem(p, "Became Demon")) skip = true;
    if (eff.once && hasRem(p, "Ability used")) { skip = true; flags.push("Ability already used: skip."); }
    if (!p.alive && !eff.wakesDead) flags.push("Dead: skip.");
    if (real?.thinks) flags.push(real.thinksNote);
    if (hasRem(p, "Became Demon") && isDemon(p)) flags.push("Just became the Demon: wake them and show them their new character first.");
    if (hasRem(p, "Poisoned")) flags.push("Poisoned: ability does nothing tonight. You may give false info.");
    if (p.reminders.some(r => r.startsWith("Drunk"))) flags.push("Drunk: ability does nothing tonight. You may give false info.");
    if (eff.team === "townsfolk" && inPlay("vortox")) flags.push("Vortox in play: this player's info must be false.");
    if (eff.team === "demon" && lunatic && real === eff) hint.push(`Then show this Demon who the Lunatic (${esc(lunatic.name)}) chose.`);
    switch (eff.id) {
      case "washerwoman": hint.push("Townsfolk in play: " + (ps.filter(q => charOf(q)?.team === "townsfolk" && q !== p).map(q => `${esc(BY_ID[q.char].name)} (${esc(q.name)})`).join(", ") || "none")); break;
      case "librarian": hint.push("Outsiders in play: " + (ps.filter(q => charOf(q)?.team === "outsider").map(q => `${esc(BY_ID[q.char].name)} (${esc(q.name)})`).join(", ") || "none, so show 0")); break;
      case "investigator": hint.push("Minions in play: " + ps.filter(q => charOf(q)?.team === "minion").map(q => `${esc(BY_ID[q.char].name)} (${esc(q.name)})`).join(", ")); break;
      case "chef": hint.push(`True answer: ${evilPairs()}. A Recluse or Spy next to evil may change this.`); break;
      case "empath": { const nb = aliveNeighbours(idx); hint.push(`Alive neighbours: ${nb.map(q => esc(q.name)).join(" & ") || "none"}. True answer: ${nb.filter(isEvil).length}.`); break; }
      case "fortuneteller": hint.push(`Demon: ${namesWith(isDemon)}. Red herring: ${namesWith(q => isRedHerring(q))}.`); break;
      case "undertaker": hint.push("Executed today: " + (ps.filter(q => hasRem(q, "Executed today")).map(q => `${esc(q.name)} → ${esc(charOf(q)?.name)}`).join(", ") || "nobody, so don't wake them")); break;
      case "imp": hint.push(`Can't kill: ${namesWith(q => hasRem(q, "Protected") || q.char === "soldier")}. If they pick the Mayor, you may kill someone else instead.`); break;
      // Bad Moon Rising
      case "grandmother": hint.push("Good players: " + (ps.filter(q => q !== p && !isEvil(q)).map(q => `${esc(q.name)} (${esc(charOf(q)?.name ?? "?")})`).join(", ") || "none")); break;
      case "godfather": hint.push("Outsiders in play: " + (charList("outsider") || "none")); break;
      case "pukka": hint.push(`Poisoned now: ${namesWith(q => hasRem(q, "Poisoned"))}. That player dies tonight.`); break;
      case "zombuul": case "shabaloth": case "po": hint.push(`Can't die tonight: ${namesWith(q => hasRem(q, "Safe") || q.char === "sailor")}.`); break;
      // Sects & Violets
      case "clockmaker": {
        const d = ps.findIndex(isDemon), n = ps.length;
        const dists = ps.map((q, j) => charOf(q)?.team === "minion" ? Math.min(Math.abs(j - d), n - Math.abs(j - d)) : Infinity);
        const best = Math.min(...dists);
        hint.push(d < 0 || best === Infinity ? "No Demon or Minion assigned yet." : `True answer: ${best}.`); break;
      }
      case "oracle": hint.push(`True answer: ${ps.filter(q => !q.alive && isEvil(q)).length} dead evil player(s).`); break;
      case "dreamer": hint.push("Characters in play: " + ps.filter(q => q !== p && q.char).map(q => `${esc(q.name)} = ${esc(charOf(q).name)}`).join(", ")); break;
      case "nodashii": hint.push("Remember: the No Dashii's nearest Townsfolk neighbours are poisoned."); break;
      case "sage": hint.push(`Demon: ${namesWith(isDemon)}.`); break;
      // Results recorded during the day
      case "juggler": if (state.juggle?.[p.id] != null) hint.push(`Juggler got ${state.juggle[p.id]} right today.`); break;
      case "gossip": { const dd = state.days?.[state.phase - 1]; if (dd) hint.push(dd.gossipTrue?.includes(p.id) ? "The Gossip's statement today was TRUE: choose a player to die." : "The Gossip's statement today was not true: nobody dies from it."); break; }
    }
    // Vortox: every Townsfolk's information is false.
    const vortox = eff.team === "townsfolk" && ps.some(q => q.char === "vortox" && q.alive && !hasRem(q, "Poisoned") && !q.reminders.some(r => r.startsWith("Drunk")));
    const truthful = !real?.thinks && !hasRem(p, "Poisoned") && !p.reminders.some(r => r.startsWith("Drunk")) && !vortox;
    steps.push({key:p.id, order, icon:eff.icon, title:eff.name, who:p.name, text:nightText(eff, first), flags, hint, skip, pid:p.id, effId:eff.id, truthful});
  });
  steps.push({key:"dawn", order:9999, icon:"☀️", title:"Dawn", text:"Wake everyone. Announce who died tonight, if anyone. Mark them dead in the Grimoire first."});
  return steps.sort((a, b) => a.order - b.order);
}
