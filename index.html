const TABS = [["setup","Setup"],["deal","Deal"],["grimoire","Grimoire"],["night","Night & Day"],["log","Game log"],["script","Script sheet"],["tips","Beginner guide"]];

function charOptions(sel, teams = TEAMS){
  return `<option value="">— none —</option>` + teams.map(t => `<optgroup label="${TEAM_LABEL[t]}">${
    ofTeam(t).map(c => `<option value="${c.id}" ${c.id === sel ? "selected" : ""}>${c.icon} ${esc(c.name)}</option>`).join("")}</optgroup>`).join("");
}

function viewSetup(){
  const n = state.players.length, opts = expectedOptions(), act = actualCounts();
  const rows = Object.entries(DIST).map(([k, v]) => `<tr class="${+k === n ? "current" : ""}"><td>${k}</td><td>${v[0]}</td><td>${v[1]}</td><td>${v[2]}</td><td>${v[3]}</td></tr>`).join("");
  let check = "";
  if (n && opts && state.players.some(p => p.char)) {
    const okAll = !act.none && opts.some(exp => TEAMS.every(t => exp[t] === act[t]));
    const mods = state.players.map(charOf).filter(c => c?.setup).map(c => c.name);
    check = okAll ? `<div class="msg ok">✓ Character counts match the setup rules${mods.length ? ` (adjusted for ${esc(mods.join(", "))})` : ""}.</div>`
      : `<div class="msg warn">⚠ Expected ${opts.map(exp => TEAMS.map(t => `${exp[t]} ${t}`).join(", ")).join(" or ")}. Current: ${TEAMS.map(t => `${act[t]} ${t}`).join(", ")}${act.none ? `, ${act.none} unassigned` : ""}.</div>`;
    const thinker = state.players.find(p => charOf(p)?.thinks && !p.drunkAs);
    if (thinker) check += `<div class="msg warn">⚠ Pick which character the ${esc(charOf(thinker).name)} thinks they are (click their seat).</div>`;
    state.players.map(charOf).filter(c => c?.special).forEach(c =>
      check += `<div class="msg warn">ℹ ${c.icon} ${esc(c.name)} has a special setup rule: <b>${esc(c.special)}</b>. Adjust the characters by hand; the count check above doesn't model it.</div>`);
    state.players.map(charOf).filter(c => c?.setupNote).forEach(c =>
      check += `<div class="msg warn">ℹ ${c.icon} ${esc(c.name)}: ${esc(c.setupNote)}.</div>`);
    for (const [a, b] of Object.entries(REQUIRES)) if (inPlay(a) && !inPlay(b))
      check += `<div class="msg warn">⚠ The ${esc(BY_ID[a].name)} needs the ${esc(BY_ID[b]?.name ?? b)} in play.</div>`;
    const mar = state.players.findIndex(p => p.char === "marionette");
    if (mar >= 0) {
      const nb = [state.players[(mar + 1) % n], state.players[(mar - 1 + n) % n]];
      if (!nb.some(isDemon)) check += `<div class="msg warn">⚠ The Marionette must sit next to the Demon. Drag their seat in the Grimoire.</div>`;
    }
  }
  const modNames = CHARS.filter(c => c.setup).map(c => c.name).join(", ");
  const bluffSel = i => `<label for="bluff${i}">Bluff ${i + 1}</label><select id="bluff${i}" data-change="bluff" data-i="${i}">${charOptions(state.bluffs[i], ["townsfolk","outsider"])}</select>`;
  return `
  <section class="panel">
    <h2>0. Script</h2>
    <p class="muted">Choose which script to play. The difficulty shows how much experience players and the Storyteller need.</p>
    <div class="scripts">${["tb","bmr","snv"].map(id => scriptCard(SCRIPTS[id])).join("")}${SCRIPT.community ? scriptCard(SCRIPT) : ""}</div>
    ${communityHtml()}
  </section>
  <section class="panel">
    <h2>1. Players</h2>
    <label for="count">Number of players (5 to 15)</label>
    <input id="count" type="number" min="5" max="15" value="${n || 8}">
    <label for="names">Names in seating order, clockwise, one per line (optional; you can rename later)</label>
    <textarea id="names" placeholder="Alex&#10;Sam&#10;Priya&#10;...">${esc(state.players.map(p => p.name).join("\n"))}</textarea>
    <div class="row"><button class="primary" data-action="create-seats">Create seats</button></div>
    <details><summary>Setup rules by player count</summary>
      <table><thead><tr><th>Players</th><th>Townsfolk</th><th>Outsiders</th><th>Minions</th><th>Demon</th></tr></thead><tbody>${rows}</tbody></table>
    </details>
  </section>
  <section class="panel">
    <h2>2. Characters</h2>
    <label class="inline"><input type="checkbox" data-change="allowBaron" ${state.allowBaron ? "checked" : ""}> Allow characters that change the Outsider count (${esc(modNames)}) in random setups</label>
    <div class="row"><button class="primary" data-action="random-assign" ${n ? "" : "disabled"}>Randomly assign characters</button>
    <span class="muted">Or click any seat in the Grimoire to set a character by hand.</span></div>
    ${check}
    <p class="muted">Hand out tokens privately. Tell the Drunk they are the Townsfolk shown in their seat ("thinks: …").</p>
  </section>
  <section class="panel">
    <h2>3. Demon bluffs</h2>
    <p class="muted">Three good characters that are <b>not</b> in play. You show them to the Demon on Night 1 (only with 7+ players).</p>
    <div class="row">${[0,1,2].map(i => `<div>${bluffSel(i)}</div>`).join("")}</div>
    <div class="row"><button data-action="random-bluffs" ${n ? "" : "disabled"}>Random bluffs</button></div>
  </section>
  <section class="panel">
    <h2>4. Start</h2>
    <div class="row"><button class="primary" data-action="start-game" ${n ? "" : "disabled"}>Start Night 1</button>
    <button class="danger" data-action="reset">Reset everything</button></div>
  </section>`;
}

const dots = (v, label) => `<span class="dots" role="img" aria-label="${label}: ${v} out of 5">${
  [1,2,3,4,5].map(i => `<span class="${i <= v ? "on" : "off"}" aria-hidden="true">●</span>`).join("")}</span>`;
// Names for travellers / fabled / loric (never dealt), in the current language.
const extraName = id => (isAr() && AR.extras?.[id]) || DATA.roles[id]?.name || id;
// Built at render time so character names follow the language.
function communityTwists(s){
  const names = (s.expIds || []).map(id => BY_ID[id]?.name).filter(Boolean);
  return names.length ? `Experimental characters: ${names.slice(0, 6).join(", ")}${names.length > 6 ? ` and ${names.length - 6} more` : ""}.` : s.twists;
}
// In Arabic, show the original English script name under the translated one.
const origName = (s, inline) => isAr() && s._en?.name && s._en.name !== s.name
  ? `${inline ? "<br>" : ""}<span class="muted no-tr orig-name" lang="en" dir="ltr">${esc(s._en.name)}</span>` : "";
const teamCounts = s => TEAMS.map(t => s.chars.filter(c => c.team === t).length).join(" / ");
function scriptCard(s){
  const counts = teamCounts(s);
  if (s.community) {
    // The selected community script: a panel (not a button) so it can hold links.
    return `<div class="script-card current">
      <h3>${s.icon} ${esc(s.name)}</h3>${origName(s)}
      <span class="level level-${s.level}">${esc(s.levelLabel)}</span>
      <span class="meter"><span>Players</span>${dots(s.players, "Player difficulty")}</span>
      <span class="meter"><span>Storyteller</span>${dots(s.storyteller, "Storyteller difficulty")}</span>
      <p><b>Experience:</b> ${esc(s.experience)}</p>
      <p>${esc(s.blurb)} ${s.score ? `👍 ${s.score}.` : ""} ${s.url ? `<a href="${esc(s.url)}" target="_blank" rel="noopener noreferrer" style="color:var(--accent)">View on botcscripts.com</a>` : ""}</p>
      <p class="muted"><b>Twists:</b> ${esc(communityTwists(s))}</p>
      ${s.extras.length ? `<p class="muted">Also lists (Storyteller-only or travellers, not dealt): ${esc(s.extras.map(extraName).join(", "))}.</p>` : ""}
      ${s.unknown.length ? `<p class="muted">Skipped unknown characters: ${esc(s.unknown.join(", "))}.</p>` : ""}
      <p class="muted">⏱ ${esc(s.time)} · ${counts} characters (T/O/M/D) · ${esc(s.type || "Full")}</p>
      <p class="muted">Difficulty is estimated from the characters on the script.</p>
    </div>`;
  }
  return `<button class="script-card" data-action="pick-script" data-script="${s.id}" aria-pressed="${s.id === SCRIPT.id}">
    <h3>${s.icon} ${esc(s.name)}</h3>${origName(s)}
    <span class="level level-${s.level}">${esc(s.levelLabel)}</span>
    <span class="meter"><span>Players</span>${dots(s.players, "Player difficulty")}</span>
    <span class="meter"><span>Storyteller</span>${dots(s.storyteller, "Storyteller difficulty")}</span>
    <p><b>Experience:</b> ${esc(s.experience)}</p>
    <p>${esc(s.blurb)}</p>
    <p class="muted"><b>Twists:</b> ${esc(s.community ? communityTwists(s) : s.twists)}</p>
    <p class="muted">⏱ ${esc(s.time)} · ${counts} characters (T/O/M/D)</p>
  </button>`;
}

    <div class="row"><label for="scriptFilter" class="inline">Show</label>
      <select id="scriptFilter" data-change="script-filter">${opt("all","All")}${opt("1","Beginner")}${opt("2","Intermediate")}${opt("3","Advanced")}${opt("4","Expert")}${opt("teensy","Teensyville (5–6 players)")}${opt("imported","Imported by me")}</select></div>
    <div class="table-scroll"><table class="script-table"><thead><tr><th>Script</th><th>Type</th><th>Difficulty (est.)</th><th>T/O/M/D</th><th>Likes</th><th></th></tr></thead>
      <tbody>${rows || `<tr><td colspan="6" class="muted">No scripts match.</td></tr>`}</tbody></table></div>
  </details>
  <details class="more" ${importMsg ? "open" : ""}>
    <summary>Import any script (JSON)</summary>
    <p class="muted">On botcscripts.com or the official script tool, download or copy a script's JSON and paste it here. Every officially released character is supported; homebrew characters are skipped.</p>
    <label for="importJson">Script JSON</label>
    <textarea id="importJson" placeholder='[{"id":"_meta","name":"My script"},"washerwoman","chef", ...]'></textarea>
    <div class="row"><button class="primary" data-action="import-script">Import and choose</button></div>
    ${importMsg ? `<div class="msg ${importMsg[0]}">${esc(importMsg[1])}</div>` : ""}
  </details>`;
}

function importScript(text){
  let arr;
  try { arr = JSON.parse(text); } catch { return ["bad", "That isn't valid JSON. Paste the whole script file."]; }
  if (arr && !Array.isArray(arr) && Array.isArray(arr.content)) arr = arr.content; // botcscripts API shape
  if (!Array.isArray(arr)) return ["bad", "Expected a JSON list, like the ones the official script tool exports."];
  const meta = arr.find(x => x && typeof x === "object" && x.id === "_meta") || {};
  const ids = arr.filter(x => !(x && typeof x === "object" && x.id === "_meta")).map(x => typeof x === "string" ? x : x?.id).filter(Boolean);
  const playable = ids.filter(i => getChar(i)).length;
  const m = {id:"u-" + uid(), name:String(meta.name || "Imported script").slice(0, 80), author:String(meta.author || "").slice(0, 60),
    type:playable <= 14 ? "Teensyville" : "Full", score:0, ids, source:"imported"};
  const s = makeScript(m);
  if (!s.chars.some(c => c.team === "demon")) return ["bad", "This script has no Demon I recognise, so it can't be played here."];
  state.customScripts.push(m); SCRIPTS[m.id] = s;
  setScript(m.id);
  return ["ok", `Imported "${s.name}" with ${s.chars.length} characters.${s.unknown.length ? ` Skipped unknown: ${s.unknown.join(", ")}.` : ""}`];
}

function setScript(id){
  if (id === SCRIPT.id || !SCRIPTS[id]) return;
  if (state.players.some(p => p.char) && !confirm(`Switch to ${SCRIPTS[id].name}? Characters, bluffs and the deal will be cleared. Seats and names stay.`)) return;
  archiveCurrent(); // save the old game under the old script's name, before switching
  state.script = id; useScript(id);
  state.players.forEach(p => Object.assign(p, {char:null, drunkAs:null, alive:true, ghostVote:true, reminders:[]}));
  state.bluffs = [null, null, null]; state.deal = null; resetGameFlags();
}

// Seat position on the circle, in % of the circle box.
function slotPos(i, n){
  const ang = (-90 + i * 360 / n) * Math.PI / 180, r = 42;
  return {left:50 + r * Math.cos(ang), top:50 + r * Math.sin(ang)};
}

// ---------------------------------------------------------------------------
// Layouts. "circle": seats sit evenly on a ring. "free": each seat keeps its own
// x/y (p.x, p.y in %) and the seating order is derived from those positions.
// ---------------------------------------------------------------------------
const isFree = () => state.layout === "free";
const clampPos = v => Math.min(93, Math.max(7, v));
function posOf(p, i, n){ return isFree() && p.x != null ? {left:p.x, top:p.y} : slotPos(i, n); }
// Give every seat an explicit position (so re-sorting never moves anyone).
function freezePositions(){
  const n = state.players.length;
  state.players.forEach((p, i) => { if (p.x == null) { const s = slotPos(i, n); p.x = s.left; p.y = s.top; } });
}
// Clockwise order around the middle of all seats, starting from 12 o'clock.
function sortByPosition(){
  freezePositions();
  const n = state.players.length; if (!n) return;
  const cx = state.players.reduce((a, p) => a + p.x, 0) / n, cy = state.players.reduce((a, p) => a + p.y, 0) / n;
  const ang = p => (Math.atan2(p.y - cy, p.x - cx) * 180 / Math.PI + 90 + 360) % 360;
  state.players = state.players.slice().sort((a, b) => ang(a) - ang(b));
}
function ringSvg(){
  const n = state.players.length; if (!isFree() || n < 3) return "";
  const pts = state.players.map((p, i) => { const s = posOf(p, i, n); return `${s.left},${s.top}`; }).join(" ");
  return `<svg class="ring" viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true"><polygon points="${pts}"/></svg>`;
}

function seatHtml(p, i, n){
  const {left, top} = posOf(p, i, n);
  const ch = charOf(p), eff = effective(p);
  const label = ch ? (ch.thinks ? `${ch.name} (thinks: ${eff?.name ?? "?"})` : ch.name) : "No character";

  return `<button class="seat ${ch ? ch.team : ""} ${p.alive ? "" : "dead"} ${selected === p.id ? "selected" : ""}"

    <span class="tags">${tags}</span></button>`;
}

// ---------------------------------------------------------------------------
// Nominations & voting. Saved per day in state.days[phase]:
//   {noms:[nom], stage:null|"by"|"on", pickBy, executed}
//   nom = {by, on, order:[ids clockwise from the nominee's left, ending with the nominee],
//          votes:{id:true|false}, idx, need, done, spent:[ghost votes used], virgin, cursed}
// ---------------------------------------------------------------------------
function dayState(){ state.days ||= {}; return (state.days[state.phase] ||= {noms:[], stage:null, pickBy:null, executed:null}); }
function voteOrder(nomineeId){
  const ps = state.players, i = ps.findIndex(p => p.id === nomineeId), n = ps.length;
  return Array.from({length:n}, (_, k) => ps[(i + 1 + k) % n].id);
}
const yesCount = nm => Object.values(nm.votes).filter(Boolean).length;
// Can this player raise a hand on this nomination? (dead players need an unspent ghost vote)
const mayVote = (q, nm) => q.alive || q.ghostVote || nm.spent?.includes(q.id);
function nextVoter(nm, from){
  for (let i = from; i < nm.order.length; i++) if (mayVote(playerById(nm.order[i]), nm)) return i;
  return nm.order.length;
}
// Who is on the block: most votes (and at least half the living); a tie with the leader means nobody.
function blockState(d){
  let on = null, top = 0, tie = false;
  d.noms.filter(n => n.done).forEach(n => {
    const c = yesCount(n); if (c < n.need) return;
    if (c > top) { top = c; on = n.on; tie = false; } else if (c === top) tie = true;
  });
  return {on:tie ? null : on, top, tie};
}

function startNomination(d, byId, onId){
  const by = playerById(byId), on = playerById(onId);
  const nm = {by:byId, on:onId, order:voteOrder(onId), votes:{}, idx:0, need:votesNeeded(), done:false, spent:[]};
  // Virgin: the first nomination uses the ability. A Townsfolk nominator is executed at once;
  // the Spy may register as a Townsfolk. Dead players have no ability.
  if (on.char === "virgin" && on.alive && !hasRem(on, "Ability used")) {
    toggleRem(on, "Ability used", true); nm.virginUsed = true;
    const impaired = ["Poisoned", "Drunk", "Drunk until dusk", "Drunk (Courtier)"].some(r => hasRem(on, r));
    if (!impaired && charOf(by)?.team === "townsfolk") nm.virgin = true;
    else if (!impaired && by.char === "spy") nm.virginSpy = true;
  }
  // Witch: a Cursed player who nominates dies.
  if (hasRem(by, "Cursed")) nm.cursed = true;
  nm.idx = nextVoter(nm, 0);
  d.noms.push(nm); d.stage = null; d.pickBy = null;
}

function finishVote(nm){
  nm.done = true;
  // Dead players who raised a hand have now used their ghost vote.
  nm.spent = Object.entries(nm.votes).filter(([id, v]) => v && playerById(id) && !playerById(id).alive).map(([id]) => id);
  nm.spent.forEach(id => { playerById(id).ghostVote = false; });
  logEvent("nom", {by:nm.by, on:nm.on, count:yesCount(nm), voters:Object.keys(nm.votes).filter(id => nm.votes[id])});
}
function deleteNomination(d, i){
  const nm = d.noms[i]; if (!nm) return;
  (nm.spent || []).forEach(id => { const q = playerById(id); if (q) q.ghostVote = true; });
  // A nomination that is taken back never happened, so the Virgin keeps her ability.
  if (nm.virginUsed) { const v = playerById(nm.on); if (v) toggleRem(v, "Ability used", false); }
  d.noms.splice(i, 1);
}

function nominationsHtml(){
  const d = dayState(), alive = state.players.filter(p => p.alive);
  const nominated = new Set(d.noms.map(n => n.on)), nominators = new Set(d.noms.map(n => n.by));
  const open = d.noms.find(n => !n.done);
  const blk = blockState(d);
  const nameOf = id => esc(playerById(id)?.name ?? "?");
  const master = state.players.find(p => hasRem(p, "Master"));
  let h = `<h3>🗳️ Nominations</h3>`;

  // Day already over (someone was executed)
  if (d.executed) {
    return h + `<div class="msg ok">⚖️ ${nameOf(d.executed)} was executed today.</div>
      <div class="row"><button class="primary big" data-action="next-phase">🌙 Start Night ${nightNum() + 1}</button>
      <button data-action="day-unexecute">↩ Undo execution</button></div>`;
  }

  // Finished nominations so far
  if (d.noms.some(n => n.done)) h += `<ol class="nom-list">${d.noms.map((n, i) => !n.done ? "" : `<li class="${blk.on === n.on ? "on-block" : ""}">
      <span>${nameOf(n.by)} ${isAr() ? "←" : "→"} <b>${nameOf(n.on)}</b>: ${yesCount(n)} votes${yesCount(n) < n.need ? ` (needs ${n.need})` : blk.on === n.on ? " · on the block" : blk.tie && yesCount(n) === blk.top ? " · tied" : ""}</span>
      <button class="mini" data-action="nom-delete" data-i="${i}" aria-label="Delete this nomination">✕</button></li>`).join("")}</ol>`;
  h += blk.on ? `<div class="msg warn block-banner">⚖️ On the block: <b>${nameOf(blk.on)}</b> with ${blk.top} votes. The next nominee needs ${blk.top + 1} or more to replace them, ${blk.top} to tie.</div>`
    : blk.tie ? `<div class="msg warn block-banner">⚖️ Tied at ${blk.top} votes: nobody is on the block. The next nominee needs ${blk.top + 1} or more.</div>`
    : d.noms.some(n => n.done) ? `<div class="msg block-banner">Nobody is on the block yet.</div>` : "";

  if (open) {
    const nm = open, c = yesCount(nm);
    h += `<div class="vote-box">`;
    if (nm.virgin) h += `<div class="msg bad">💥 ${nameOf(nm.by)} nominated the ${esc(BY_ID.virgin.name)} and is a Townsfolk: they are executed immediately, and the day ends.
      <div class="row"><button class="danger" data-action="day-execute" data-id="${nm.by}">⚖️ Execute ${nameOf(nm.by)} now</button>
      <button data-action="nom-flag-off" data-flag="virgin">Not this time (they don't register as Townsfolk)</button></div></div>`;
    if (nm.virginSpy) h += `<div class="msg warn">🕵️ ${nameOf(nm.by)} is the Spy and nominated the ${esc(BY_ID.virgin.name)}. You may have the Spy register as a Townsfolk: they are executed immediately, and the day ends.
      <div class="row"><button class="danger" data-action="day-execute" data-id="${nm.by}">⚖️ Execute ${nameOf(nm.by)} now</button>
      <button data-action="nom-flag-off" data-flag="virginSpy">No, the Spy doesn't register as Townsfolk</button></div></div>`;
    if (nm.cursed) h += `<div class="msg bad">🧙 ${nameOf(nm.by)} was Cursed by the Witch and nominated: they die now.
      <div class="row"><button class="danger" data-action="nom-curse-kill" data-id="${nm.by}">💀 ${nameOf(nm.by)} dies</button>
      <button data-action="nom-flag-off" data-flag="cursed">Not this time</button></div></div>`;
    h += `<p class="vote-title">${nameOf(nm.by)} nominated <b>${nameOf(nm.on)}</b></p>
      <p class="vote-count" aria-live="polite"><b>${c}</b> votes · needs <b>${Math.max(nm.need, blk.top + (blk.on || blk.tie ? 1 : 0))}</b> to go on the block</p>
      <p class="muted"><span>Go round clockwise from ${nameOf(nm.order[0])}.</span> <span>Tap ✋ for a raised hand, ✖ for no. The nominee votes last.</span></p>
      <ol class="vote-rows">${nm.order.map((id, i) => {
        const q = playerById(id), can = mayVote(q, nm), v = nm.votes[id];
        const tags = [!q.alive && (can ? "👻 ghost vote" : "💀 no vote left"), id === nm.on && "nominee",
          q.char === "butler" && master && `only counts if ${esc(master.name)} votes`].filter(Boolean);
        const warn = q.char === "butler" && master && v && !nm.votes[master.id];
        return `<li class="${i === nm.idx ? "current" : ""} ${can ? "" : "cannot"}">
          <span class="voter">${i === nm.idx ? "▶ " : ""}${esc(q.name)}${tags.map(t => ` <small class="muted">${t}</small>`).join("")}${warn ? ` <small class="flag">⚠ master isn't voting</small>` : ""}</span>
          <span class="vote-btns"><button class="vote yes" data-action="vote" data-id="${id}" data-v="1" aria-pressed="${v === true}" ${can ? "" : "disabled"} aria-label="${esc(q.name)} votes yes">✋</button>
          <button class="vote no" data-action="vote" data-id="${id}" data-v="0" aria-pressed="${v === false}" ${can ? "" : "disabled"} aria-label="${esc(q.name)} votes no">✖</button></span></li>`;
      }).join("")}</ol>
      <div class="row"><button class="primary big" data-action="vote-finish">✅ Finish vote (${c})</button>
        <button data-action="vote-reset">↺ Start the count again</button>
        <button data-action="nom-cancel">✕ Cancel nomination</button></div></div>`;
    return h;
  }

  // Picking a new nomination
  if (d.stage === "by") {
    const can = alive.filter(p => !nominators.has(p.id));
    h += `<div class="vote-box"><p class="vote-title">Who is nominating?</p>
      <div class="pick-grid">${can.map(p => `<button class="pick-btn" data-action="nom-by" data-id="${p.id}">${esc(p.name)}</button>`).join("") || `<p class="muted">Everyone alive has already nominated today.</p>`}</div>
      <div class="row"><button data-action="nom-cancel">Cancel</button></div></div>`;
  } else if (d.stage === "on") {
    const can = state.players.filter(p => !nominated.has(p.id));
    h += `<div class="vote-box"><p class="vote-title">${nameOf(d.pickBy)} nominates…</p>
      <div class="pick-grid">${can.map(p => `<button class="pick-btn" data-action="nom-on" data-id="${p.id}">${p.alive ? "" : "💀 "}${esc(p.name)}</button>`).join("") || `<p class="muted">Everyone has already been nominated today.</p>`}</div>
      <div class="row"><button data-action="nom-cancel">Cancel</button></div></div>`;
  } else {
    h += `<div class="row"><button class="primary big" data-action="nom-new">🗳️ New nomination</button></div>`;
  }

  // End of the day
  h += `<h3>⚖️ End of the day</h3><div class="row">
    ${blk.on ? `<button class="danger big" data-action="day-execute" data-id="${blk.on}">⚖️ Execute ${nameOf(blk.on)}</button>` : ""}
    <button class="${blk.on ? "" : "primary"}" data-action="next-phase">🌙 No execution, start Night ${nightNum() + 1}</button></div>
    <details class="more"><summary>Execute someone else (another ability caused it)</summary>
      <div class="row"><label for="execSel" class="inline">Execute</label>
      <select id="execSel"><option value="">— choose —</option>${alive.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join("")}</select>
      <button class="danger" data-action="execute">Execute</button></div></details>`;
  return h;
}

// ---------------------------------------------------------------------------
// Game log. Deaths, executions, revivals, character changes and phase changes are
// picked up automatically by comparing snapshots on every render, so nothing is
// missed whichever button caused it. Nominations, night choices and day abilities
// are logged where they happen. state.log = [{ph, k, ...}]
// ---------------------------------------------------------------------------
function logEvent(k, data = {}){ (state.log ||= []).push({ph:state.phase, k, ...data}); }
function snapshot(){ return {ph:state.phase, p:Object.fromEntries(state.players.map(p => [p.id, {a:p.alive, c:p.char, x:hasRem(p, "Executed today")}]))}; }
function trackChanges(){
  const now = snapshot(), was = state.snap;
  state.snap = now;
  if (!was || now.ph === 0) return; // nothing to log during setup
  if (now.ph !== was.ph) logEvent("phase");
  for (const [id, n] of Object.entries(now.p)) {
    const o = was.p[id]; if (!o) continue;
    if (o.a && !n.a) logEvent(n.x ? "executed" : "died", {p:id});
    if (!o.a && n.a) logEvent("revived", {p:id});
    if (o.c && n.c && o.c !== n.c) logEvent("char", {p:id, from:o.c, to:n.c});
  }
}
const pName = id => esc(playerById(id)?.name ?? "?");
const cName = id => BY_ID[id] ? `${BY_ID[id].icon} ${esc(BY_ID[id].name)}` : "?";
const phaseName = ph => ph === 0 ? (isAr() ? "التجهيز" : "Setup") : ph % 2 ? `${isAr() ? "الليلة" : "Night"} ${Math.ceil(ph / 2)}` : `${isAr() ? "اليوم" : "Day"} ${ph / 2}`;
// One line per event, written directly in both languages.
// P = how to turn a player id into a name (past games pass their own saved names).
function logLine(e, P = pName){
  const ar = isAr(), C = cName;
  switch (e.k) {
    case "phase": return ar ? `${isNightPh(e.ph) ? "🌙" : "☀️"} ابتدت ${phaseName(e.ph)}` : `${isNightPh(e.ph) ? "🌙" : "☀️"} ${phaseName(e.ph)} began`;
    case "died": return ar ? `💀 ${P(e.p)} مات` : `💀 ${P(e.p)} died`;
    case "executed": return ar ? `⚖️ ${P(e.p)} اتعدم` : `⚖️ ${P(e.p)} was executed`;
    case "revived": return ar ? `❤️ ${P(e.p)} رجع للحياة` : `❤️ ${P(e.p)} came back to life`;
    case "char": return ar ? `🔄 ${P(e.p)} اتحوّل من ${C(e.from)} لـ ${C(e.to)}` : `🔄 ${P(e.p)} changed from ${C(e.from)} to ${C(e.to)}`;
    case "nom": return ar ? `🗳️ ${P(e.by)} رشّح ${P(e.on)}: ${e.count} ${e.count === 1 ? "صوت" : "أصوات"}${e.voters?.length ? ` (${e.voters.map(P).join("، ")})` : ""}`
      : `🗳️ ${P(e.by)} nominated ${P(e.on)}: ${e.count} vote${e.count === 1 ? "" : "s"}${e.voters?.length ? ` (${e.voters.map(P).join(", ")})` : ""}`;
    case "pick": {
      const what = e.yesno ? (e.yesno === "YES" ? (ar ? "آه" : "yes") : (ar ? "لأ" : "no")) : e.none ? (ar ? "محدش" : "no one")
        : [...(e.players || []).map(P), ...(e.chars || []).map(C)].join(ar ? "، " : ", ");
      return ar ? `${BY_ID[e.eff]?.icon || "🌙"} ${P(e.p)} (${esc(BY_ID[e.eff]?.name)}) اختار: ${what}` : `${BY_ID[e.eff]?.icon || "🌙"} ${P(e.p)} (${esc(BY_ID[e.eff]?.name)}) chose ${what}`;
    }
    case "day": return `${BY_ID[e.eff]?.icon || "☀️"} ${P(e.p)} (${esc(BY_ID[e.eff]?.name)}): ${esc(ar ? e.ar : e.en)}`;
    case "end": return ar ? `🏁 اللعبة خلصت: ${e.winner === "good" ? "الطيبين كسبوا" : "الأشرار كسبوا"}` : `🏁 Game over: ${e.winner === "good" ? "Good wins" : "Evil wins"}`;
  }
  return "";
}
const isNightPh = ph => ph > 0 && ph % 2 === 1;

// ---------------------------------------------------------------------------
// Day abilities: public or once-per-game things players do during the day.
// The Storyteller taps on their own screen (these are public), the app works out
// the result, applies it, marks "Ability used", and logs it.
// ---------------------------------------------------------------------------
const DAY_ABILITIES = {
  slayer:{once:true, kind:"pick", n:1, en:"Slayer shoots", ar:"قاتل الشياطين بيضرب", ask:"Who does the Slayer shoot?"},
  psychopath:{kind:"pick", n:1, perDay:true, en:"Psychopath kills", ar:"السايكو بيقتل", ask:"Who does the Psychopath kill?"},
  juggler:{once:true, kind:"juggle", en:"Juggler guesses", ar:"البهلوان بيخمّن"},
  alsaahir:{kind:"many", perDay:true, en:"Alsaahir guesses the evil team", ar:"الساهر بيخمّن الأشرار", ask:"Who do they say are ALL the Minions and the Demon?"},
  gossip:{kind:"truth", perDay:true, en:"Gossip made a statement", ar:"الرغّاي قال جملة"},
  artist:{once:true, kind:"used", en:"Artist asked their question", ar:"الفنّان سأل سؤاله"},

function dayAbilityList(){
  const d = dayState(), out = [];
  state.players.forEach(p => {
    const ef = effective(p), a = ef && DAY_ABILITIES[ef.id]; if (!a) return;
    if (a.dead ? p.alive : !p.alive) return;
    if (a.once && hasRem(p, "Ability used")) return;
    if (a.perDay && d.used?.[p.id]) return;
    out.push({p, id:ef.id, a});
  });
  // Damsel: any living Minion may publicly guess the Damsel once.
  if (CHARS.some(c => c.id === "damsel") || inPlay("damsel"))
    state.players.filter(p => p.alive && charOf(p)?.team === "minion" && !hasRem(p, "Guess Used"))
      .forEach(p => out.push({p, id:"damselguess", a:{kind:"pick", n:1, en:`Minion guesses the ${BY_ID.damsel.name}`, ar:`تابع بيخمّن ${BY_ID.damsel.name}`, ask:`Who do they say is the ${BY_ID.damsel.name}?`}}));
  return out;
}
const abilityWorks = p => charOf(p)?.id === effective(p)?.id && !hasRem(p, "Poisoned") && !p.reminders.some(r => r.startsWith("Drunk"));

// Work out and apply a day ability. Returns {cls, html, buttons}.
function resolveDayAbility(d, open, v){
  const p = playerById(open.pid), id = open.id, a = open.a, works = abilityWorks(p), sel = open.sel.map(playerById);
  const t = sel[0], ar = isAr();
  const log = (en, arTxt) => logEvent("day", {p:p.id, eff:id === "damselguess" ? "damsel" : id, en, ar:arTxt});
  if (a.once) toggleRem(p, "Ability used", true);
  if (a.perDay) (d.used ||= {})[p.id] = true;
  switch (id) {
    case "slayer": {
      if (works && isDemon(t)) { t.alive = false; log(`shot ${t.name}, who was the Demon and died`, `ضرب ${t.name}، وكان الشيطان ومات`);
        return {cls:"ok", html:`🎯 ${esc(t.name)} ${ar ? "كان الشيطان ومات!" : "was the Demon and dies!"}${inPlay("scarletwoman") ? `<br>${ar ? "خلّي بالك: الست القرمزية ممكن تبقى الشيطان." : "Careful: the Scarlet Woman may become the Demon."}` : ""}`}; }
      log(`shot ${t.name}: nothing happened`, `ضرب ${t.name}: محصلش حاجة`);
      const rec = works && t.char === "recluse";
      return {cls:"warn", html:`🎯 ${ar ? "محصلش حاجة." : "Nothing happens."}${!works ? ` ${ar ? "(قدرته مش شغّالة: سكران أو مسموم)" : "(their ability doesn't work: drunk or poisoned)"}` : ""}${rec ? `<br>${ar ? "المنعزل ممكن يظهر كأنه الشيطان، لو حبّيت." : "The Recluse may register as the Demon if you want."}` : ""}`,
        buttons:rec ? `<button class="danger" data-action="ab-kill" data-id="${t.id}">💀 ${esc(t.name)} ${ar ? "يموت" : "dies"}</button>` : ""};
    }
    case "psychopath":
      if (works) { t.alive = false; log(`killed ${t.name}`, `قتل ${t.name}`); return {cls:"warn", html:`🔪 ${esc(t.name)} ${ar ? "مات." : "dies."}`}; }
      log(`chose ${t.name}, but their ability doesn't work`, `اختار ${t.name}، بس قدرته مش شغّالة`);
      return {cls:"warn", html:ar ? "محصلش حاجة (سكران أو مسموم)." : "Nothing happens (drunk or poisoned)."};
    case "alsaahir": {
      const evil = state.players.filter(q => ["minion","demon"].includes(charOf(q)?.team)).map(q => q.id).sort().join();
      const right = works && sel.map(q => q.id).sort().join() === evil;
      log(`guessed ${sel.map(q => q.name).join(", ")}: ${right ? "correct" : "wrong"}`, `خمّن ${sel.map(q => q.name).join("، ")}: ${right ? "صح" : "غلط"}`);
      return right ? {cls:"ok", html:`🧞 ${ar ? "التخمين صح: الطيبين كسبوا!" : "Correct: Good wins!"}`, buttons:`<button class="primary" data-action="end-game" data-v="good">🏁 ${ar ? "خلّص اللعبة: الطيبين كسبوا" : "End game: Good wins"}</button>`}
        : {cls:"warn", html:`🧞 ${ar ? "التخمين غلط. محصلش حاجة." : "Wrong. Nothing happens."}`};
    }
    case "damselguess": {
      toggleRem(p, "Guess Used", true);
      const right = t.char === "damsel" && abilityWorks(t);
      log(`guessed ${t.name} as the Damsel: ${right ? "correct" : "wrong"}`, `خمّن إن ${t.name} هي الآنسة: ${right ? "صح" : "غلط"}`);
      return right ? {cls:"bad", html:`👰 ${ar ? "صح! الأشرار كسبوا." : "Correct! Evil wins."}`, buttons:`<button class="primary" data-action="end-game" data-v="evil">🏁 ${ar ? "خلّص اللعبة: الأشرار كسبوا" : "End game: Evil wins"}</button>`}
        : {cls:"warn", html:`👰 ${ar ? "غلط. محصلش حاجة." : "Wrong. Nothing happens."}`};
    }
    case "klutz": {
      const bad = works && isEvil(t);
      log(`chose ${t.name}: ${bad ? "evil, so good loses" : "good, nothing happens"}`, `اختار ${t.name}: ${bad ? "شرير، فالطيبين خسروا" : "طيب، محصلش حاجة"}`);
      return bad ? {cls:"bad", html:`🍌 ${ar ? "اختار شرير: الطيبين خسروا." : "They chose an evil player: Good loses."}`, buttons:`<button class="primary" data-action="end-game" data-v="evil">🏁 ${ar ? "خلّص اللعبة: الأشرار كسبوا" : "End game: Evil wins"}</button>`}
        : {cls:"ok", html:`🍌 ${ar ? "اختار طيب. محصلش حاجة." : "They chose a good player. Nothing happens."}`};
    }
    case "moonchild": {
      const dies = works && !isEvil(t);
      if (dies) toggleRem(t, "Dies tonight (Moonchild)", true);
      log(`chose ${t.name}: ${dies ? "good, so they die tonight" : "evil, nothing happens"}`, `اختارت ${t.name}: ${dies ? "طيب، فهيموت الليلة" : "شرير، محصلش حاجة"}`);
      return {cls:dies ? "warn" : "ok", html:`🌙 ${dies ? (ar ? `${esc(t.name)} طيب: هيموت الليلة (اتحطّت علامة).` : `${esc(t.name)} is good: they die tonight (marked).`) : (ar ? "اختارت شرير. محصلش حاجة." : "They chose an evil player. Nothing happens.")}`};
    }
    case "juggler": {
      const pairs = open.pairs.filter(g => g.p && g.c);
      const n = pairs.filter(g => playerById(g.p)?.char === g.c).length;
      (state.juggle ||= {})[p.id] = works ? n : null;
      log(`guessed ${pairs.length} (${n} correct)`, `خمّن ${pairs.length} (${n} صح)`);
      return {cls:"ok", html:`🤹 ${ar ? `${n} من ${pairs.length} صح. هيتعرض الرقم ده الليلة في خطوة البهلوان.` : `${n} of ${pairs.length} correct. The number will be ready at the Juggler's night step.`}${!works ? ` ${ar ? "(قدرته مش شغّالة: ادّيله رقم غلط)" : "(their ability doesn't work: give a wrong number)"}` : ""}`};
    }
    case "gossip":
      if (v === "true") (d.gossipTrue ||= []).push(p.id);
      log(`statement was ${v === "true" ? "true" : "false"}`, `الجملة كانت ${v === "true" ? "صح" : "غلط"}`);
      return {cls:"ok", html:`🗣️ ${v === "true" ? (ar ? "الجملة صح: حد هيموت الليلة (هتلاقيها في خطوة الرغّاي)." : "True: someone dies tonight (shown at the Gossip's night step).") : (ar ? "الجملة غلط: محدش بيموت." : "False: nobody dies from it.")}`};
    default:
      log("used their ability", "استخدم قدرته");
      return {cls:"ok", html:`✓ ${ar ? "اتسجّل." : "Recorded."}`};
  }
}

// Discussion timer (not saved; lives while the page is open)

let timer = {total:180, left:180, running:false, endAt:0, done:false, int:null};
const fmtTime = s => { const t = Math.ceil(Math.max(0, s)); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, "0")}`; };
function suggestedMinutes(){ const n = aliveCount(); return n >= 10 ? 5 : n >= 7 ? 3 : 2; }
function timerTick(){
  if (timer.running) {
    timer.left = (timer.endAt - Date.now()) / 1000;
    if (timer.left <= 0) { timer.running = false; timer.left = 0; timer.done = true; clearInterval(timer.int); timer.int = null; timeUp(); render(); return; }
  }
  const t = fmtTime(timer.left);
  const a = document.getElementById("timerText"); if (a) a.textContent = t;
  const hdr = document.getElementById("timerHdr"); if (hdr) { hdr.hidden = !timer.running; hdr.textContent = `⏱ ${t}`; }
}
function timeUp(){
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.35, 0.7].forEach(at => { const o = ctx.createOscillator(), g = ctx.createGain(); o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(0.25, ctx.currentTime + at); g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + at + 0.3); o.start(ctx.currentTime + at); o.stop(ctx.currentTime + at + 0.3); });
  } catch {}
  navigator.vibrate?.([300, 150, 300]);
}
function timerHtml(){
  const sug = suggestedMinutes();
  return `<h3>⏱️ Discussion timer</h3>
    <div class="timer ${timer.done ? "done" : ""}"><span id="timerText" class="timer-text" aria-live="off">${fmtTime(timer.left)}</span>
      ${timer.done ? `<span class="timer-up" role="status">⏰ Time's up</span>` : ""}</div>
    <div class="row">${[1, 2, 3, 5, 10].map(m => `<button class="mini ${m === sug ? "sug" : ""}" data-action="tm-set" data-v="${m}" aria-pressed="${timer.total === m * 60}">${m} min${m === sug ? " ★" : ""}</button>`).join("")}</div>
    <div class="row"><button class="primary" data-action="tm-toggle">${timer.running ? "⏸ Pause" : "▶ Start"}</button>
      <button data-action="tm-add">+1 min</button><button data-action="tm-reset">↺ Reset</button></div>
    <p class="muted">★ suggested for ${aliveCount()} living players. Make it shorter as the game goes on.</p>`;
}

// ---------------------------------------------------------------------------
const HISTORY_KEY = "botc-grimoire-history-v1";
const HISTORY_MAX = 200;

function loadHistory(){
  let h; try { h = JSON.parse(localStorage.getItem(HISTORY_KEY)); } catch { backupCorrupt(HISTORY_KEY); return []; }
  return Array.isArray(h) ? h.filter(g => g && g.id && Array.isArray(g.players)) : [];
}
function saveHistory(h){ safeSet(HISTORY_KEY, JSON.stringify(h.slice(0, HISTORY_MAX))); }

function archiveCurrent(){
  if (!gameStarted() || !state.players.some(p => p.char)) return;
  state.gameId ||= uid(); state.gameStart ||= Date.now();
  const h = loadHistory().filter(g => g.id !== state.gameId);
  h.push({id:state.gameId, start:state.gameStart, saved:Date.now(), script:SCRIPT.id, scriptName:SCRIPT._en?.name || SCRIPT.name,

  h.sort((a, b) => b.start - a.start);

}

  const unused = (id, txt) => { const p = state.players.find(q => effective(q)?.id === id && q.alive && !hasRem(q, "Ability used")); if (p) special.push(txt.replace("{n}", esc(p.name))); };
  const nm2 = id => esc(BY_ID[id].name); // current-language character name
  unused("virgin", `🎒 ${nm2("virgin")} ({n}) hasn't been nominated yet. If a Townsfolk nominates them, that nominator is executed on the spot. Mark Ability used after the first nomination.`);
  unused("slayer", `🎯 ${nm2("slayer")} ({n}) can still shoot once. If the target is the Demon, the Demon dies.`);
  if (inPlay("saint")) special.push(`🗄️ ${nm2("saint")} in play: if they're executed, evil wins.`);
  const master = state.players.find(p => hasRem(p, "Master"));
  if (master) special.push(`🕶️ The ${nm2("butler")} may only vote if ${esc(master.name)} votes too.`);
  if (inPlay("scarletwoman")) special.push(`🔁 If the Demon dies while 5+ players are alive, the ${nm2("scarletwoman")} becomes the Demon. The status box offers a button that swaps their token for you.`);
  state.players.forEach(p => { const c = charOf(p); if (c?.dayNote && p.alive) special.push(`${c.icon} ${esc(c.name)} (${esc(p.name)}) ${esc(c.dayNote)}`); });
  const cursed = state.players.filter(p => hasRem(p, "Cursed"));
  if (cursed.length) special.push(`🧙 Cursed by the Witch: ${cursed.map(p => esc(p.name)).join(", ")}. If they nominate today, they die.`);
  const mad = state.players.filter(p => hasRem(p, "Mad"));
  if (mad.length) special.push(`🎭 Must be mad today: ${mad.map(p => esc(p.name)).join(", ")}. If they break madness, you may execute them.`);
  return `<section class="panel"><h2>${phaseLabel()}</h2>${msgs}
    <details class="more"><summary>📖 Voting rules</summary>
    <ol>
      <li>Announce last night's deaths.</li>
      <li>Open discussion, then private chats (5 to 10 minutes; shorter as the game goes on).</li>
      <li>Nominations: each living player may nominate once, and each player may be nominated once per day.</li>
      <li>To go on the block, a nominee needs <b>${votesNeeded()}+ votes</b> (half of the ${alive.length} living, rounded up) <b>and</b> more votes than anyone already on the block. A tie means nobody is on the block.</li>
      <li>Dead players vote once more in the whole game (their ghost vote).</li>
      <li>At the end of the day, execute whoever is on the block.</li>
    </ol></details>
    ${suggestedWinner() && !state.ended ? endGameButtons() : ""}
    ${special.length ? `<h3>Watch out today</h3><ul>${special.map(s => `<li>${s}</li>`).join("")}</ul>` : ""}
    ${timerHtml()}
    ${dayAbilitiesHtml()}
    ${nominationsHtml()}</section>`;
}

function viewScript(){
  const ids = CHARS.map(c => c.id);
  const json = JSON.stringify([{id:"_meta", name:SCRIPT._en?.name || SCRIPT.name, author:"Storyteller"}, ...ids]);
  const orderOf = key => CHARS.map(c => ({o:nightOrder(c, key === "first"), t:`${c.icon} ${esc(c.name)}`})).filter(x => x.o != null);
  const sorted = list => list.sort((a, b) => a.o - b.o).map(x => x.t);
  const orderList = key => sorted(orderOf(key));
  const first = sorted([{o:sheetPos("minioninfo", 1), t:"🧑‍🤝‍🧑 Minion info (7+)"}, {o:sheetPos("demoninfo", 2), t:"😈 Demon info + bluffs (7+)"}, ...orderOf("first")]);
  const jinx = [];
  CHARS.forEach(a => Object.entries(DATA.jinxes[a.id] || {}).forEach(([b, why]) => {
    const reason = (isAr() && AR.jinx?.[`${a.id}|${b}`]) || why;
    if (CHARS.some(c => c.id === b)) jinx.push(`<li><b>${esc(a.name)} & ${esc(BY_ID[b]?.name ?? b)}:</b> ${esc(reason)}</li>`);
  }));
  return `<section class="panel sheet">
    <div class="row no-print"><button data-action="print">🖨️ Print player sheet</button></div>
    <h2>${SCRIPT.icon} ${esc(SCRIPT.name)} <span class="level level-${SCRIPT.level}">${esc(SCRIPT.levelLabel)}</span></h2>
    <p class="muted">${esc(SCRIPT.blurb)} Good wins by executing the Demon. Evil wins when only 2 players are left alive.</p>
    ${TEAMS.map(t => `<h3 class="team-${t}">${TEAM_LABEL[t]}</h3>${ofTeam(t).map(c =>
      `<div class="char-line"><span aria-hidden="true">${c.icon}</span><span><b>${esc(c.name)}</b></span><span class="ab">${esc(c.ability)}</span></div>`).join("")}`).join("")}
    <p class="muted">* Not on the first night.</p>
    <h3>Night order (Storyteller)</h3>
    <p><b>First night:</b> ${first.join(" → ")}</p>
    <p><b>Other nights:</b> ${orderList("other").join(" → ")}</p>
    ${jinx.length ? `<h3>Jinxes (special rules when both are in play)</h3><ul>${jinx.join("")}</ul>` : ""}
    <div class="no-print">
      <h3><label for="json" style="margin:0">JSON for the official script tool / botc.app</label></h3>
      <p class="muted">Paste this into the official script tool or botc.app to load the same script.</p>
      <textarea id="json" readonly>${esc(json)}</textarea>
      <div class="row"><button data-action="copy-json">Copy JSON</button></div>
    </div></section>`;
}

function viewTips(){
  const s = SCRIPT;
  const scriptPanel = `<section class="panel"><h2>${s.icon} ${esc(s.name)} <span class="level level-${s.level}">${esc(s.levelLabel)}</span></h2>
    <div class="meter" style="max-width:320px"><span>Players</span>${dots(s.players, "Player difficulty")}</div>
    <div class="meter" style="max-width:320px"><span>Storyteller</span>${dots(s.storyteller, "Storyteller difficulty")}</div>
    <p><b>Experience needed:</b> ${esc(s.experience)}</p>
    <p>${esc(s.blurb)} <b>Twists:</b> ${esc(s.community ? communityTwists(s) : s.twists)}</p>
    ${s.tips.length ? `<h3>Storyteller tips for this script</h3><ul>${s.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul>` : ""}
    </section>`;
  return scriptPanel + `<section class="panel"><h2>Storyteller guide for a first game</h2>
    ${s.id === "tb" ? "" : `<p class="muted">This general guide is written for Trouble Brewing. Most of it still applies.</p>`}
    <h3>60-second pitch to read aloud</h3>
    <blockquote>"A Demon is hiding in our town, and it kills one of us every night. Most of you are good townsfolk, and each of you has a special ability that gives you clues. A few of you are evil Minions, and you know who the Demon is. Each day, we talk, nominate, and vote to execute someone. Good wins if we execute the Demon. Evil wins if only two of us are left alive. Dead players keep talking and get one last vote, so nobody is out of the game. Lying is allowed, and evil players will pretend to be good."</blockquote>
    <h3>Tips for beginners</h3>
    <ul>
      <li><b>Sweet spot:</b> 8 to 12 players. Allow about 60 to 90 minutes, plus 15 minutes to explain the rules.</li>
      <li><b>Before the game:</b> hand everyone the printed sheet. Encourage people to ask you their questions in private.</li>
      <li><b>Night 1:</b> be generous with accurate information. Beginners have more fun when their clues mostly add up.</li>
      <li><b>Poisoned or drunk players:</b> give false info that is plausible, not obviously nonsense.</li>
      <li><b>Balance:</b> if good is way ahead, have the Demon's kills hit the strongest information players. If evil is way ahead, give a clear clue that points at the Demon.</li>
      <li><b>Keep the day moving:</b> set a timer for discussion. Call nominations when the conversation starts going in circles.</li>
      <li><b>For the first game, consider skipping</b> the Drunk and the Spy. They are the most confusing characters. Assign the rest by hand from the Grimoire.</li>
      <li><b>Protect your Grimoire:</b> use <i>Hide</i> in the top bar whenever someone might see your screen.</li>
    </ul>
    <h3>Rules people often get wrong</h3>
    <ul>
      <li>You don't have to say your character's name, and you can lie about it. Good players usually share clues anyway.</li>
      <li>The Demon can kill themselves at night to pass the Demon role to a Minion.</li>
      <li>An execution happens at most once per day, and you can choose not to execute anyone.</li>
      <li>Only the Storyteller knows who is poisoned or drunk.</li>
    </ul></section>`;
}

const VIEWS = {setup:viewSetup, deal:viewDeal, grimoire:viewGrimoire, night:viewNight, log:viewLog, script:viewScript, tips:viewTips};

function render(){
  $("#title").textContent = `${SCRIPT.icon} ${SCRIPT.name}`;
  document.title = `${SCRIPT.name} — Storyteller Grimoire`;
  const lv = $("#scriptLevel"); lv.textContent = SCRIPT.levelLabel; lv.className = `level level-${SCRIPT.level}`;
  const ph = $("#phase"); ph.textContent = phaseLabel(); ph.className = "phase" + (isNight() ? " night" : "");
  $("#stats").textContent = state.players.length ? `${aliveCount()}/${state.players.length} alive · ${votesNeeded()}+ votes to execute` : "";
  $("#hideBtn").textContent = state.hidden ? "👁️ Show grimoire" : "🙈 Hide grimoire";
  $("#hideBtn").setAttribute("aria-pressed", String(state.hidden));
  $("#tabs").innerHTML = TABS.map(([k, l]) => `<button role="tab" aria-selected="${k === tab}" data-action="tab" data-tab="${k}">${l}</button>`).join("");
  trackChanges(); // log deaths, executions, character and phase changes
  $("#view").innerHTML = VIEWS[tab]();
  const ovScroll = document.querySelector("#overlay .overlay")?.scrollTop || 0; // keep the builder's scroll position
  $("#overlay").innerHTML = overlayHtml();
  if (composer || prompt?.stage === "pick") { const ov = document.querySelector("#overlay .overlay"); if (ov) ov.scrollTop = ovScroll; }
  const lb = $("#langBtn");
  lb.hidden = !AR;
  lb.textContent = isAr() ? "🌐 English" : "🌐 عربي مصري";
  lb.setAttribute("lang", isAr() ? "en" : "ar");
  lb.setAttribute("aria-label", isAr() ? "Switch to English" : "التبديل للعربي المصري");
  ["header", "#tabs", "#view", "#overlay", "footer"].forEach(s => translateDom(document.querySelector(s)));
  document.title = isAr() ? `${SCRIPT.name} — كتاب الراوي` : document.title;
  if (composer) {
    // Keep keyboard focus where the Storyteller was (or start on the title field).
    (refocus && document.querySelector(`#overlay ${refocus}`) || (!refocus && $("#cLabel")))?.focus?.({preventScroll:true});
    refocus = null;
  } else if (prompt) {
    if (prompt.stage === "done") $('#overlay [data-action="p-close"]')?.focus();
    else if (refocus) { document.querySelector(`#overlay ${refocus}`)?.focus({preventScroll:true}); refocus = null; }
    else $("#overlay .prompt-what")?.closest(".overlay")?.querySelector(".pick-btn, [data-action='p-yesno']")?.focus({preventScroll:true});
  } else if (reveal || showing || (revealOpen && state.ended) || pastOpen) $("#overlay button")?.focus();
  else if (refocus) { document.querySelector(`#view ${refocus}`)?.focus({preventScroll:true}); refocus = null; }
  // On a phone the seat editor sits below the circle: bring it into view after a tap.
  if (scrollToEditor) { scrollToEditor = false; if (window.matchMedia?.("(max-width:900px)").matches) document.querySelector(".grim aside")?.scrollIntoView?.({block:"nearest", behavior:"smooth"}); }
  timerTick(); // refresh the timer text and the header indicator
  save();
}

document.addEventListener("click", e => {
  const b = e.target.closest("[data-action]"); if (!b || b.disabled) return;
  const a = b.dataset.action, p = playerById(b.dataset.id);
  // Keep what the Storyteller typed in the card builder across re-renders.
  if (composer && $("#cLabel")) { composer.label = $("#cLabel").value; composer.text = $("#cText").value; }
  if ((composer && a.startsWith("c-")) || (prompt && (a === "p-player" || a === "p-char"))) refocus = `[data-action="${a}"]${b.dataset.v != null ? `[data-v="${CSS.escape(b.dataset.v)}"]` : ""}${b.dataset.id ? `[data-id="${b.dataset.id}"]` : ""}`;
  const toggle = (k, v) => { composer[k] = composer[k] === v ? null : v; };
  switch (a) {
    case "compose": {
      if (b.dataset.youare) { const q = playerById(b.dataset.youare); composer = blankComposer({label:"You are", tokens:[effective(q).id], focus:["tokens"]}); }
      else if (b.dataset.step) { const s = isNight() ? nightSteps().find(x => x.key === b.dataset.step) : null; composer = s ? presetForStep(s) : blankComposer(); }
      else composer = blankComposer();
      break;
    }
    case "c-label": composer.label = b.dataset.v; break;
    case "c-name": { const i = composer.names.indexOf(b.dataset.id); i >= 0 ? composer.names.splice(i, 1) : composer.names.push(b.dataset.id); break; }
    case "c-token-remove": composer.tokens.splice(+b.dataset.i, 1); refocus = "#cToken"; break;
    case "c-num": toggle("number", +b.dataset.v); break;
    case "c-yesno": toggle("yesno", b.dataset.v); break;
    case "c-align": toggle("align", b.dataset.v); break;
    case "c-clear": composer = blankComposer({label:""}); break;
    case "c-cancel": composer = null; break;
    case "c-show": showing = composerCard(composer); composer = null; break;
    // "Ask them to choose"
    case "p-open": {
      const s = isNight() ? nightSteps().find(x => x.key === b.dataset.step) : null; if (!s) return;
      prompt = {k:pickKey(s), stepKey:s.key, pid:s.pid, effId:s.effId, spec:pickSpec(s), players:[], chars:[], stage:"pick"};
      break;
    }
    case "p-player": {
      const i = prompt.players.indexOf(b.dataset.id);
      if (i >= 0) prompt.players.splice(i, 1);
      else { if (prompt.players.length >= prompt.spec.players) prompt.players.shift(); prompt.players.push(b.dataset.id); }
      break;
    }
    case "p-char": {
      const i = prompt.chars.indexOf(b.dataset.v);
      if (i >= 0) prompt.chars.splice(i, 1); else { if (prompt.chars.length >= prompt.spec.chars) prompt.chars.shift(); prompt.chars.push(b.dataset.v); }
      break;
    }
    case "p-confirm": savePick(prompt, {players:[...prompt.players], chars:[...prompt.chars]}); prompt.stage = "done"; break;
    case "p-none": savePick(prompt, {players:[], chars:[], none:true}); prompt.stage = "done"; break;
    case "p-yesno": savePick(prompt, {players:[], chars:[], yesno:b.dataset.v}); prompt.stage = "done"; break;
    case "p-cancel": case "p-close": prompt = null; break;
    case "p-kill": if (p && p.alive) { p.alive = false; toggleRem(p, "Died tonight", true); } break;
    case "tab": tab = b.dataset.tab; break;
    case "create-seats": createSeats(); break;
    case "random-assign": randomAssign(); break;
    case "random-bluffs": randomBluffs(); break;
    case "start-game":
      if (gameStarted()) resetGameFlags(); // restarting: the earlier game goes to Past games
      state.done = {}; state.phase = 0; state.gameId = uid(); state.gameStart = Date.now();
      ensureRedHerring(); setPhase(1); tab = "night"; break;
    case "reset":
      if (!confirm("Erase all seats, characters and notes?")) return;
      archiveCurrent(); // the game in progress is kept in Past games
      // Keep the user's settings (language, script, imported scripts, table layout); clear the game.
      state = Object.assign(newState(), {lang:state.lang, script:SCRIPT.id, customScripts:state.customScripts, layout:state.layout});
      selected = null; reveal = null; showing = null; tab = "setup";
      applyLang();
      break;
    case "pick-script": setScript(b.dataset.script); importMsg = null; break;
    case "import-script": importMsg = importScript($("#importJson").value.trim()); applyLang(); break;
    case "toggle-lang": state.lang = isAr() ? "en" : "ar"; state.advice = {}; applyLang(); break;
    case "remove-script": {
      const sid = b.dataset.script, s = SCRIPTS[sid];
      if (!s || !confirm(`Remove the imported script "${s.name}"?`)) return;
      if (SCRIPT.id === sid) { setScript("tb"); if (SCRIPT.id === sid) return; }
      state.customScripts = state.customScripts.filter(m => m.id !== sid); delete SCRIPTS[sid]; break;
    }
    case "layout":
      state.layout = b.dataset.layout;
      if (isFree()) freezePositions(); // start from where the seats are now
      break;
    case "layout-reset": state.players.forEach(p => { delete p.x; delete p.y; }); state.layout = "circle"; break;
    case "next-phase": if (state.phase === 0) ensureRedHerring(); setPhase(state.phase + 1); if (tab === "setup") tab = "night"; break;
    case "prev-phase": setPhase(state.phase - 1); break;
    case "toggle-hide": state.hidden = !state.hidden; break;
    case "select": selected = selected === b.dataset.id ? null : b.dataset.id; if (selected) scrollToEditor = true; break;
    case "toggle-alive":
      p.alive = !p.alive;
      if (!p.alive && isNight()) toggleRem(p, "Died tonight", true);
      if (p.alive) { p.ghostVote = true; toggleRem(p, "Died tonight", false); }
      break;
    case "toggle-ghost": p.ghostVote = !p.ghostVote; break;
    case "move": {
      const i = state.players.indexOf(p), n = state.players.length, j = (i + Number(b.dataset.dir) + n) % n;
      const q = state.players[j];
      if (isFree()) { freezePositions(); [p.x, p.y, q.x, q.y] = [q.x, q.y, p.x, p.y]; } // swap places on the table too
      [state.players[i], state.players[j]] = [state.players[j], state.players[i]]; break;
    }
    case "add-seat":
      if (state.players.length >= 15) { alert("This script supports up to 15 players."); return; }
      state.players.push({id:uid(), name:`Player ${state.players.length + 1}`, char:null, drunkAs:null, alive:true, ghostVote:true, reminders:[]}); break;
    case "remove-seat": {
      if (!confirm(`Remove ${p.name}?`)) return;
      state.players = state.players.filter(q => q !== p); selected = null;
      // Drop the seat from today's voting too, so nothing points at a missing player.
      Object.values(state.days || {}).forEach(d => d.noms.forEach(n => { n.order = n.order.filter(x => x !== p.id); delete n.votes[p.id]; }));
      break;
    }
    case "execute": case "day-execute": {
      const t = playerById(a === "execute" ? $("#execSel").value : b.dataset.id); if (!t) return;
      const d = dayState();
      // A Virgin execution happens mid-nomination: keep it as a finished nomination (so an undo
      // can't repeat it); any other open nomination is dropped.
      const open = d.noms.find(n => !n.done);
      if (open && (open.virgin || open.virginSpy)) { open.done = true; open.votes = {}; open.virgin = open.virginSpy = false; }
      else if (open) d.noms.splice(d.noms.indexOf(open), 1);
      d.executed = t.id; d.executedWasAlive = t.alive;
      t.alive = false; toggleRem(t, "Executed today", true); break;
    }
    case "day-unexecute": {
      const d = dayState(), t = playerById(d.executed);
      if (t) { toggleRem(t, "Executed today", false); if (d.executedWasAlive !== false) t.alive = true; }
      d.executed = null; break;
    }
    // Nominations & voting
    case "nom-new": dayState().stage = "by"; break;
    case "nom-by": { const d = dayState(); d.pickBy = b.dataset.id; d.stage = "on"; break; }
    case "nom-on": startNomination(dayState(), dayState().pickBy, b.dataset.id); break;
    case "nom-cancel": {
      const d = dayState(), open = d.noms.find(n => !n.done);
      if (open) deleteNomination(d, d.noms.indexOf(open));
      d.stage = null; d.pickBy = null; break;
    }
    case "nom-delete": if (!confirm("Delete this nomination? Any ghost votes used are given back.")) return; deleteNomination(dayState(), +b.dataset.i); break;
    case "nom-flag-off": { const open = dayState().noms.find(n => !n.done); if (open) open[b.dataset.flag] = false; break; }
    case "nom-curse-kill": {
      const q = playerById(b.dataset.id); if (q) q.alive = false;
      const open = dayState().noms.find(n => !n.done); if (open) { open.cursed = false; open.need = votesNeeded(); } break;
    }
    case "vote": {
      const nm = dayState().noms.find(n => !n.done); if (!nm) return;
      const i = nm.order.indexOf(b.dataset.id);
      nm.votes[b.dataset.id] = b.dataset.v === "1";
      if (i >= nm.idx) nm.idx = nextVoter(nm, i + 1); // move the clock hand on
      break;
    }
    case "vote-reset": { const nm = dayState().noms.find(n => !n.done); if (nm) { nm.votes = {}; nm.idx = nextVoter(nm, 0); } break; }
    case "vote-finish": { const nm = dayState().noms.find(n => !n.done); if (nm) finishVote(nm); break; }
    case "deal-new": startDeal(b.dataset.mode); break;
    case "deal-pick": reveal = {mode:"deal", cardIdx:+b.dataset.i, seatId:state.deal.seat, stage:"confirm"}; break;
    case "remind": { const id = $("#remindSel").value; if (!id) return; reveal = {mode:"remind", seatId:id, stage:"confirm"}; break; }
    case "reveal-show": reveal.stage = "show"; break;
    case "reveal-cancel": reveal = null; break;
    case "reveal-done": finishReveal(); break;
    // Day abilities
    case "ab-open": {
      const it = dayAbilityList().find(x => x.p.id === b.dataset.id && x.id === b.dataset.ab); if (!it) return;
      const d = dayState(); d.abilityResult = null;
      d.ability = {pid:it.p.id, id:it.id, a:it.a, sel:[], pairs:[]};
      if (it.a.kind === "used") { d.abilityResult = resolveDayAbility(d, d.ability); d.ability = null; }
      break;
    }
    case "ab-sel": {
      const o = dayState().ability; if (!o) return;
      const i = o.sel.indexOf(b.dataset.id);
      if (i >= 0) o.sel.splice(i, 1); else { if (o.a.kind === "pick" && o.sel.length >= o.a.n) o.sel.shift(); o.sel.push(b.dataset.id); }
      refocus = `[data-action="ab-sel"][data-id="${b.dataset.id}"]`; break;
    }
    case "ab-go": { const d = dayState(); if (!d.ability) return; d.abilityResult = resolveDayAbility(d, d.ability, b.dataset.v); d.ability = null; break; }
    case "ab-cancel": dayState().ability = null; break;
    case "ab-dismiss": dayState().abilityResult = null; break;
    case "ab-kill": if (p) p.alive = false; dayState().abilityResult = null; break;
    // Timer
    case "tm-set": timer = {...timer, total:+b.dataset.v * 60, left:+b.dataset.v * 60, running:false, done:false}; clearInterval(timer.int); timer.int = null; break;
    case "tm-toggle":
      if (timer.running) { timer.running = false; timer.left = (timer.endAt - Date.now()) / 1000; clearInterval(timer.int); timer.int = null; }
      else { if (timer.left <= 0) timer.left = timer.total; timer.running = true; timer.done = false; timer.endAt = Date.now() + timer.left * 1000; timer.int = setInterval(timerTick, 250); }
      break;
    case "tm-add": timer.left += 60; timer.total += 60; if (timer.running) timer.endAt += 60000; timer.done = false; break;
    case "tm-reset": clearInterval(timer.int); timer = {...timer, left:timer.total, running:false, done:false, int:null}; break;
    // End of game
    case "end-game":
      state.ended = {winner:b.dataset.v, ph:state.phase}; logEvent("end", {winner:b.dataset.v}); revealOpen = true;
      archiveCurrent(); break;
    case "end-undo": state.ended = null; state.log = (state.log || []).filter(e => e.k !== "end"); archiveCurrent(); break;
    // Past games
    case "past-view": pastOpen = b.dataset.id; break;
    case "past-close": pastOpen = null; break;
    case "past-delete": {
      if (!confirm("Delete this game from the history? This can't be undone.")) return;
      saveHistory(loadHistory().filter(g => g.id !== b.dataset.id));
      if (pastOpen === b.dataset.id) pastOpen = null;
      break;
    }
    case "past-clear":
      if (!confirm("Delete ALL past games? This can't be undone.")) return;
      saveHistory([]); pastOpen = null; break;
    case "reveal-open": revealOpen = true; break;
    case "reveal-close": revealOpen = false; break;
    case "reroll": delete state.advice[b.dataset.key]; break;
    case "show-card": showing = state.advice[b.dataset.key]?.card || null; break;
    case "show-step": showing = stepCard(b.dataset.step, b.dataset.pid); break;
    case "sw-takeover": {
      const sw = playerById(b.dataset.id); if (!sw) return;
      const dead = state.players.filter(q => isDemon(q) && !q.alive);
      const old = dead.find(q => hasRem(q, "Executed today") || hasRem(q, "Died tonight")) || dead[0];
      sw.char = old?.char || "imp"; sw.drunkAs = null; sw.becameDemonPh = state.phase;
      toggleRem(sw, "Became Demon", true); break;
    }
    case "show-done": showing = null; break;
    case "spy-grimoire": state.hidden = false; tab = "grimoire"; break;
    case "print": window.print(); return;
    case "copy-json": {
      const ta = $("#json");
      (navigator.clipboard?.writeText(ta.value) ?? Promise.reject()).then(() => { b.textContent = "Copied ✓"; }, () => { ta.select(); document.execCommand("copy"); b.textContent = "Copied ✓"; });
      return;
    }
  }
  render();
});

document.addEventListener("change", e => {
  const el = e.target, c = el.dataset.change; if (!c) return;
  const p = playerById(el.dataset.id);
  switch (c) {
    case "allowBaron": state.allowBaron = el.checked; break;
    case "jg-p": case "jg-c": {
      const o = dayState().ability; if (!o) return;
      const i = +el.dataset.i; o.pairs[i] ||= {p:"", c:""};
      o.pairs[i][c === "jg-p" ? "p" : "c"] = el.value;
      refocus = `[data-change="${c}"][data-i="${i}"]`; break;
    }
    case "c-token":
      if (composer) { composer.label = $("#cLabel").value; composer.text = $("#cText").value; if (el.value) composer.tokens.push(el.value); refocus = "#cToken"; }
      break;
    case "script-filter": scriptFilter = el.value; break;
    case "bluff": state.bluffs[+el.dataset.i] = el.value || null; break;
    case "notes": state.notes = el.value; save(); return;
    case "p-name": p.name = el.value.trim() || p.name; break;
    case "p-char": { const nc = el.value || null; if (nc !== p.char) p.drunkAs = null; p.char = nc; break; }
    case "p-drunk": p.drunkAs = el.value || null; break;
    case "p-rem": toggleRem(p, el.dataset.rem, el.checked); break;
    case "step": state.done[el.dataset.key] = el.checked; break;
    case "deal-seat": state.deal.seat = el.value; break;
    case "choice": {
      const k = el.dataset.key, arr = state.choices[k] || [];
      arr[+el.dataset.i] = el.value || null; state.choices[k] = arr; delete state.advice[k]; break;
    }
    case "balance": {
      state.balance = el.value;
      const pre = state.phase + ":";
      Object.keys(state.advice).forEach(k => { if (k.startsWith(pre)) delete state.advice[k]; });
      break;
    }
  }
  render();
});

// ---------------------------------------------------------------------------
// Drag seats around the circle to match the real table (mouse, pen and touch).
// The dragged seat follows the pointer; the others slide to preview the new order.
// ---------------------------------------------------------------------------
let drag = null, suppressClick = false;
const LONG_PRESS_MS = 400;
const reorderedIds = (id, target) => { const ids = state.players.map(p => p.id).filter(x => x !== id); ids.splice(target, 0, id); return ids; };

document.addEventListener("pointerdown", e => {
  const seat = e.target.closest(".circle .seat");
  if (drag || !seat || e.button !== 0 || state.players.length < 2) return; // one drag at a time
  // Touch: press and hold to pick a seat up, so a normal swipe still scrolls the page.
  const touch = e.pointerType === "touch";
  drag = {id:seat.dataset.id, seat, circle:seat.closest(".circle"), x:e.clientX, y:e.clientY, moved:false, target:null, pointerId:e.pointerId, armed:!touch};
  if (touch) drag.timer = setTimeout(() => {
    if (!drag || drag.seat !== seat) return;
    drag.armed = true; seat.classList.add("armed"); navigator.vibrate?.(30);
  }, LONG_PRESS_MS);
});

document.addEventListener("pointermove", e => {
  if (!drag || e.pointerId !== drag.pointerId) return;
  if (!drag.armed) { // finger moved before the hold finished: it's a scroll, not a drag
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) > 10) { clearTimeout(drag.timer); drag = null; }
    return;
  }
  if (!drag.moved) {
    if (Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return; // a tap, not a drag
    drag.moved = true;
    drag.seat.classList.add("dragging");
    drag.seat.setPointerCapture?.(e.pointerId);
  }
  e.preventDefault();
  const r = drag.circle.getBoundingClientRect();
  const px = Math.min(100, Math.max(0, (e.clientX - r.left) / r.width * 100));
  const py = Math.min(100, Math.max(0, (e.clientY - r.top) / r.height * 100));
  if (isFree()) { // free placement: the seat simply follows the pointer
    drag.px = clampPos(px); drag.py = clampPos(py);
    drag.seat.style.left = drag.px + "%"; drag.seat.style.top = drag.py + "%";
    return;
  }
  drag.seat.style.left = px + "%"; drag.seat.style.top = py + "%";
  const n = state.players.length;
  const deg = (Math.atan2(py - 50, px - 50) * 180 / Math.PI + 90 + 360) % 360;
  const target = Math.round(deg / (360 / n)) % n;
  if (target === drag.target) return;
  drag.target = target;
  reorderedIds(drag.id, target).forEach((id, i) => {
    if (id === drag.id) return;
    const el = drag.circle.querySelector(`.seat[data-id="${id}"]`), pos = slotPos(i, n);
    if (el) { el.style.left = pos.left + "%"; el.style.top = pos.top + "%"; }
  });
});

function endDrag(e, cancel){
  if (!drag || e.pointerId !== drag.pointerId) return;
  const d = drag; drag = null;
  clearTimeout(d.timer); d.seat.classList.remove("armed");
  if (!d.moved) return; // plain click: let the normal select handler run
  suppressClick = true; setTimeout(() => { suppressClick = false; }, 300);
  if (!cancel && isFree() && d.px != null) {
    freezePositions();
    Object.assign(playerById(d.id), {x:d.px, y:d.py});
    sortByPosition();
  } else if (!cancel && d.target != null) state.players = reorderedIds(d.id, d.target).map(playerById);
  render();
}
document.addEventListener("pointerup", e => endDrag(e, false));
document.addEventListener("pointercancel", e => endDrag(e, true));
// Once a seat is picked up by touch, stop the page from scrolling under the finger,
// and stop the long-press menu from opening on it.
document.addEventListener("touchmove", e => { if (drag?.armed && e.cancelable) e.preventDefault(); }, {passive:false});
document.addEventListener("contextmenu", e => { if (e.target.closest?.(".circle .seat")) e.preventDefault(); });
// Swallow the click that follows a drag so it doesn't also select the seat.
document.addEventListener("click", e => { if (suppressClick) { suppressClick = false; e.stopPropagation(); e.preventDefault(); } }, true);

// Keyboard alternative. Circle: Alt+→ clockwise, Alt+← counter-clockwise.
// Free placement: Alt+arrows nudge the seat (add Shift for bigger steps).
const NUDGE = {ArrowLeft:[-1,0], ArrowRight:[1,0], ArrowUp:[0,-1], ArrowDown:[0,1]};
document.addEventListener("keydown", e => {
  const seat = e.target.closest?.(".circle .seat");
  if (!seat || !e.altKey || !NUDGE[e.key]) return;
  if (isFree()) {
    e.preventDefault();
    freezePositions();
    const p = playerById(seat.dataset.id), step = e.shiftKey ? 8 : 2, [dx, dy] = NUDGE[e.key];
    p.x = clampPos(p.x + dx * step); p.y = clampPos(p.y + dy * step);
    sortByPosition(); render();
    document.querySelector(`.circle .seat[data-id="${seat.dataset.id}"]`)?.focus();
    return;
  }
  if (!["ArrowLeft","ArrowRight"].includes(e.key)) return;
  e.preventDefault();
  const n = state.players.length, i = state.players.findIndex(p => p.id === seat.dataset.id);
  const j = (i + (e.key === "ArrowRight" ? 1 : -1) + n) % n;
  state.players = reorderedIds(seat.dataset.id, j).map(playerById);
  render();
  document.querySelector(`.circle .seat[data-id="${seat.dataset.id}"]`)?.focus();
});

document.addEventListener("keydown", e => {
  if (e.key !== "Escape") return;
  if (showing) { showing = null; render(); }
  else if (composer) { composer = null; render(); }
  else if (prompt) { prompt = null; render(); }
  else if (revealOpen) { revealOpen = false; render(); }
  else if (pastOpen) { pastOpen = null; render(); }
  else if (reveal && reveal.stage === "confirm") { reveal = null; render(); }
});

render();
</script>
</body>
</html>
